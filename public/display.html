<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 80px;
        }

        .scoreboard {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(2px);
        }

        .team-name {
            background: rgba(128, 128, 128, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 28px;
            font-weight: bold;
            min-width: 180px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .score {
            color: white;
            font-size: 48px;
            font-weight: bold;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .score.left {
            background: rgba(46, 125, 50, 0.9);
        }

        .score.right {
            background: rgba(183, 28, 28, 0.9);
        }

        .vs {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 8px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="scoreboard">
        <div class="team-name" id="leftTeam">Team 1</div>
        <div class="score left" id="leftScore">0</div>
        <div class="vs">-</div>
        <div class="score right" id="rightScore">0</div>
        <div class="team-name" id="rightTeam">Team 2</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const leftTeamEl = document.getElementById('leftTeam');
        const rightTeamEl = document.getElementById('rightTeam');
        const leftScoreEl = document.getElementById('leftScore');
        const rightScoreEl = document.getElementById('rightScore');
        
        socket.on('gameUpdate', (gameState) => {
            leftTeamEl.textContent = gameState.leftTeam;
            rightTeamEl.textContent = gameState.rightTeam;
            leftScoreEl.textContent = gameState.leftScore;
            rightScoreEl.textContent = gameState.rightScore;
        });
    </script>
</body>
</html>
