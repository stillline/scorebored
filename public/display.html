<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 80px;
        }

        .scoreboard {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #808080;
            padding: 6px 20px;
            border-radius: 8px;
            height: 50px;
        }

        .team-name {
            background: transparent;
            color: #ffffff;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            min-width: 300px;
            max-width: 300px;
            text-align: center;
            -webkit-text-stroke: 2px #ffffff;
            text-stroke: 2px #ffffff;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .score {
            color: #ffffff;
            font-size: 56px;
            font-weight: bold;
            width: 100px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            -webkit-text-stroke: 2px #ffffff;
            text-stroke: 2px #ffffff;
            background: #2E7D32;
        }
    </style>
</head>
<body>
    <div class="scoreboard">
        <div class="team-name" id="leftTeam">Team 1</div>
        <div class="score" id="leftScore">0</div>
        <div class="score" id="rightScore">0</div>
        <div class="team-name" id="rightTeam">Team 2</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const leftTeamEl = document.getElementById('leftTeam');
        const rightTeamEl = document.getElementById('rightTeam');
        const leftScoreEl = document.getElementById('leftScore');
        const rightScoreEl = document.getElementById('rightScore');
        
        function hexToRgba(hex, alpha = 1.0) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        function adjustTextSize(element) {
            const maxWidth = 220; // Account for padding
            const baseFontSize = 32;
            const minFontSize = 16;
            
            // Create a temporary element to measure text width
            const temp = document.createElement('span');
            temp.style.visibility = 'hidden';
            temp.style.position = 'absolute';
            temp.style.fontWeight = 'bold';
            temp.style.fontSize = baseFontSize + 'px';
            temp.textContent = element.textContent;
            document.body.appendChild(temp);
            
            let fontSize = baseFontSize;
            while (temp.offsetWidth > maxWidth && fontSize > minFontSize) {
                fontSize -= 2;
                temp.style.fontSize = fontSize + 'px';
            }
            
            element.style.fontSize = fontSize + 'px';
            document.body.removeChild(temp);
        }
        
        function updateDisplay(gameState) {
            console.log('Updating display with gameState:', gameState);
            
            leftTeamEl.textContent = gameState.leftTeam;
            rightTeamEl.textContent = gameState.rightTeam;
            leftScoreEl.textContent = gameState.leftScore;
            rightScoreEl.textContent = gameState.rightScore;
            
            // Adjust text size for team names
            adjustTextSize(leftTeamEl);
            adjustTextSize(rightTeamEl);
            
            if (gameState.leftColor) {
                leftScoreEl.style.background = hexToRgba(gameState.leftColor);
            }
            if (gameState.rightColor) {
                rightScoreEl.style.background = hexToRgba(gameState.rightColor);
            }
            
            console.log('Applying text color:', gameState.textColor);
            if (gameState.textColor) {
                leftTeamEl.style.setProperty('color', gameState.textColor, 'important');
                rightTeamEl.style.setProperty('color', gameState.textColor, 'important');
                leftScoreEl.style.setProperty('color', gameState.textColor, 'important');
                rightScoreEl.style.setProperty('color', gameState.textColor, 'important');
            }
            
            console.log('Applying background color:', gameState.backgroundColor);
            if (gameState.backgroundColor) {
                const scoreboard = document.querySelector('.scoreboard');
                console.log('Scoreboard element:', scoreboard);
                scoreboard.style.setProperty('background', gameState.backgroundColor, 'important');
            }
        }

        socket.on('gameUpdate', updateDisplay);
    </script>
</body>
</html>
