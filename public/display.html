<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Display</title>
<style>
/* ============================================================
   LUMA KEY CONTRACT
   #000000 is the only transparent value and is used for the
   stage background only. Every visible pixel sits at or above
   --floor.
   ============================================================ */
:root{
  --floor:#1A1E24;
  --shell-2:#2A3038;
  --white:#FFFFFF;
  --dim:#B9C0C8;
  --face:"Helvetica Neue",Helvetica,Arial,"SF Pro Display",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--face)}
/* #stage is a fixed 1920x1080 canvas, scaled to fill the viewport - same
   coordinate space a legacy preset's x/y/w/h used. When the active item
   is an overlay, #stage holds a single full-size iframe pointed at
   /overlay/:id instead (see renderDisplay) - that page already has its
   own live socket/data binding, so nothing here duplicates it. */
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;
  background:#000;overflow:hidden;transform-origin:top left}
/* scrolling="no" on the element (below) is the actual mechanism that
   suppresses the iframe's own internal scrollbar when its content
   overflows - e.g. a logo or the HTML-block transform pushing content
   past the 1920x1080 edge, or simply content taller than expected. The
   CSS overflow property on an <iframe> itself doesn't affect its
   content document's scrollbars in any browser; this exists only as the
   outer element's own (irrelevant here) overflow, kept hidden for
   consistency with every other canvas-sized element on this page. */
#overlayFrame{position:absolute;top:0;left:0;width:1920px;height:1080px;border:none;overflow:hidden;display:none}
/* Bracket ladder layer (gameState.ladder, setLadder): /ladder?bare=1 on a black
   background, so the ATEM's luma key shows the bracket over the program.
   Above the scorebug overlay, below the commercial break. */
#ladderFrame{position:absolute;top:0;left:0;width:1920px;height:1080px;border:none;overflow:hidden;display:none;z-index:5;background:#000}
/* #presetLayer is what renderPreset() tears down and rebuilds on every
   render - kept as a dedicated child of #stage, a sibling of
   #overlayFrame, specifically so renderPreset's own "wipe every child of
   targetEl" teardown (see scorebug-render.js) can never touch
   #overlayFrame even when the active item is a preset, not an overlay. */
#presetLayer{position:absolute;top:0;left:0;width:1920px;height:1080px}

/* Commercial Break Video Overlay */
.commercial-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.commercial-overlay.active {
    display: flex;
}

.commercial-video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000000;
    pointer-events: none;
}

.commercial-video::-webkit-media-controls,
.commercial-video::-webkit-media-controls-panel,
.commercial-video::-webkit-media-controls-play-button,
.commercial-video::-webkit-media-controls-start-playback-button,
.commercial-video::-webkit-media-controls-volume-slider,
.commercial-video::-webkit-media-controls-mute-button,
.commercial-video::-webkit-media-controls-timeline,
.commercial-video::-webkit-media-controls-fullscreen-button {
    display: none !important;
}

/* Debug overlay - diagnostic only, remove once the editor's reliability
   is confirmed. Deliberately NOT part of any preset/luma-key contract;
   sits above everything, plain readable text, not meant to look good. */
/* Hidden by default - toggled on remotely from /control via
   gameState.debugOverlay (setDebugOverlay socket event), since this sits
   as plain readable text over the live HDMI output and the Pi driving
   the display isn't always convenient to walk over to mid-show. */
#debugOverlay{position:fixed;right:8px;bottom:8px;z-index:9999;
  background:rgba(0,0,0,0.75);color:#0f0;font:12px/1.4 monospace;
  padding:8px 10px;border-radius:4px;white-space:pre;pointer-events:none;
  display:none}
#debugOverlay.enabled{display:block}
#debugOverlay.stale{color:#ff0}
#debugOverlay.disconnected{color:#f00}
</style>
</head>
<body>

<!-- Elements are rendered into #presetLayer dynamically from the active
     preset, OR #overlayFrame is shown pointed at /overlay/:id when the
     active item is an overlay instead - see renderDisplay() below. No
     static layout here. -->
<div id="stage">
  <div id="presetLayer"></div>
  <iframe id="overlayFrame" scrolling="no"></iframe>
  <iframe id="ladderFrame" scrolling="no"></iframe>
</div>

<!-- Commercial Break Video Overlay -->
<div class="commercial-overlay" id="commercialOverlay">
    <video class="commercial-video" id="commercialVideo" autoplay playsinline disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback">
        Your browser does not support the video tag.
    </video>
</div>

<div id="debugOverlay"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/scorebug-render.js"></script>
<script>
"use strict";
const socket = io();
const stageEl = document.getElementById("stage");
const presetLayerEl = document.getElementById("presetLayer");

// ---- debug overlay (diagnostic only, see CSS comment) ----
const debugEl = document.getElementById("debugOverlay");
const debugState = { lastUpdateAt: null, renderCount: 0, activeKind: undefined, activeId: undefined, renderedVersion: undefined, enabled: false };

function renderDebugOverlay(){
  const connected = socket.connected;
  const secondsSinceUpdate = debugState.lastUpdateAt ? ((Date.now() - debugState.lastUpdateAt) / 1000).toFixed(1) : "never";
  debugEl.textContent =
    "socket: " + (connected ? "connected" : "DISCONNECTED") + "\n" +
    "last gameUpdate: " + secondsSinceUpdate + "s ago\n" +
    "renders: " + debugState.renderCount + "\n" +
    "active: " + debugState.activeKind + "/" + debugState.activeId + "\n" +
    "rendered version: " + debugState.renderedVersion;
  debugEl.classList.toggle("disconnected", !connected);
  debugEl.classList.toggle("stale", connected && debugState.lastUpdateAt && (Date.now() - debugState.lastUpdateAt) > 10000);
  debugEl.classList.toggle("enabled", debugState.enabled);
}
setInterval(renderDebugOverlay, 500);
socket.on("connect", renderDebugOverlay);
socket.on("disconnect", renderDebugOverlay);

// Scale the 1920x1080 stage to fill whatever viewport this actually runs
// in (the kiosk launches at exactly 1920x1080, so normally scale=1, but
// this keeps the page correct if that ever changes or it's previewed in a
// differently-sized window).
function fitStage(){
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stageEl.style.transform = "scale(" + scale + ")";
}
window.addEventListener("resize", fitStage);
fitStage();

// A socket reconnect alone doesn't mean the server process restarted (a
// brief network blip reconnects the same process fine) - only reload the
// page when gameState._serverInstanceId actually changes, which happens
// exactly once per real server restart. This is how the kiosk picks up a
// code deploy (new display.html / scorebug-render.js) without needing a
// manual Chromium restart - and reloading in-place, rather than killing
// the window, avoids ever exposing the bare desktop (the page's own CSS
// background is solid black before any content paints, so there's no
// white flash either).
let knownServerInstanceId = null;

function reloadIfServerRestarted(gameState){
  const id = gameState._serverInstanceId;
  if(!id) return false;
  if(knownServerInstanceId === null){
    knownServerInstanceId = id;
    return false;
  }
  if(id !== knownServerInstanceId){
    console.log("Server restarted (new instance id) - reloading to pick up any code changes");
    window.location.reload();
    return true;
  }
  return false;
}

// What's drawn on #stage is driven by gameState.activeKind/activeId -
// either a legacy preset (element array, rendered via renderPreset) or an
// overlay (pasted HTML/CSS, shown via #overlayFrame pointed at its own
// /overlay/:id URL, which already has its own live socket/data binding -
// see renderDisplay). Re-resolved on every gameUpdate push. No active
// item (or one that fails to load) falls back to a minimal built-in
// preset layout so the kiosk never shows a blank stage.
let loadedPreset = null;
let latestGameState = null;
const overlayFrameEl = document.getElementById('overlayFrame');

const FALLBACK_PRESET = {
  id: null,
  elements: [
    { id: "_fb_nameA", type: "dataText", role: "teamName", side: "left", x: 60, y: 940, w: 360, h: 60, z: 1,
      text: { fontSizePx: 32, fontWeight: 700, color: "#FFFFFF", align: "left" } },
    { id: "_fb_scoreA", type: "dataText", role: "score", side: "left", x: 440, y: 920, w: 100, h: 90, z: 1,
      text: { fontSizePx: 56, fontWeight: 700, color: "#FFFFFF", align: "center" } },
    { id: "_fb_clock", type: "dataText", role: "clock", side: null, x: 860, y: 930, w: 200, h: 70, z: 1,
      text: { fontSizePx: 44, fontWeight: 700, color: "#FFFFFF", align: "center" } },
    { id: "_fb_scoreB", type: "dataText", role: "score", side: "right", x: 1380, y: 920, w: 100, h: 90, z: 1,
      text: { fontSizePx: 56, fontWeight: 700, color: "#FFFFFF", align: "center" } },
    { id: "_fb_nameB", type: "dataText", role: "teamName", side: "right", x: 1500, y: 940, w: 360, h: 60, z: 1,
      text: { fontSizePx: 32, fontWeight: 700, color: "#FFFFFF", align: "right" } },
  ],
};

// Always fetches fresh rather than caching by preset id - a preset's
// ACTIVE VERSION can change (rolling back to an older one) without
// gameState.activeId itself ever changing, so an id-only cache would miss
// exactly that update. This is one small GET against a local JSON file
// per gameUpdate, not worth trading correctness for.
async function loadActivePreset(presetId){
  if(!presetId) return { ...FALLBACK_PRESET, _debugVersion: "fallback" };
  try {
    const res = await fetch("/api/presets/" + presetId);
    if(!res.ok) throw new Error("preset fetch failed: " + res.status);
    const preset = await res.json();
    const version = (preset.versions || []).find(v => v.version === preset.activeVersion);
    if(!version) throw new Error("preset has no active version");
    return { id: preset.id, canvas: version.canvas, elements: version.elements, _debugVersion: version.version };
  } catch (e) {
    console.error("Falling back to built-in layout - could not load preset", presetId, e);
    return { ...FALLBACK_PRESET, _debugVersion: "fallback (fetch failed)" };
  }
}

setInterval(() => {
  if(!loadedPreset || !latestGameState) return;
  latestGameState._currentClock = latestGameState.clock
    ? { ...latestGameState.clock, localAnchorAt: latestGameState._clockAnchorAt }
    : null;
  tickClockElements(latestGameState, presetLayerEl);
}, 250);

// Socket.IO doesn't await an async handler, so back-to-back gameUpdate
// pushes (e.g. a quick Save followed by Set Active) can have overlapping
// renderDisplay calls in flight at once - each does its own preset fetch,
// and without this guard whichever fetch happened to resolve LAST would
// win and get painted, even if it was triggered by an older, since-
// superseded gameUpdate. That stale-wins race is exactly the kind of bug
// that looks like "it just stopped updating" rather than an obvious
// crash. renderGeneration makes only the most-recently-STARTED render
// allowed to actually touch the DOM.
let renderGeneration = 0;

let shownOverlayId = null; // which overlay (if any) #overlayFrame currently points at - avoids an unnecessary reload on every gameUpdate when nothing about the active overlay changed

// Bracket ladder layer: shown when gameState.ladder.active; .src only
// reassigned when the tournament changes so the page's own refresh loop is
// not restarted on every gameUpdate.
const ladderFrameEl = document.getElementById('ladderFrame');
let shownLadderSrc = null;
function renderLadderLayer(ladder){
  const active = !!(ladder && ladder.active);
  if (!active) { ladderFrameEl.style.display = 'none'; return; }
  const src = '/ladder?bare=1' + (ladder.tournament ? '&t=' + encodeURIComponent(ladder.tournament) : '');
  if (src !== shownLadderSrc) { ladderFrameEl.src = src; shownLadderSrc = src; }
  ladderFrameEl.style.display = 'block';
}

async function renderDisplay(gameState){
  console.log('Updating display with gameState:', gameState);

  debugState.lastUpdateAt = Date.now();
  debugState.activeKind = gameState.activeKind;
  debugState.activeId = gameState.activeId;
  debugState.enabled = !!gameState.debugOverlay;
  renderDebugOverlay();

  if(reloadIfServerRestarted(gameState)) return;

  // Handle commercial break state
  if (gameState.commercialBreak) {
    if (gameState.commercialBreak.active && gameState.commercialBreak.videoPath) {
      if (!isCommercialActive) {
        startCommercialBreak(gameState.commercialBreak.videoPath);
      }
    } else if (!gameState.commercialBreak.active && isCommercialActive) {
      stopCommercialBreak(false);
    }
  }

  renderLadderLayer(gameState.ladder);

  // Anchor the clock to THIS device's receipt time, not a timestamp from
  // the Pi - see scorebug-render.js's clock-interpolation comment. This
  // MUST happen before the preset fetch below, not after: clock.
  // remaining_seconds is a snapshot as of the moment this gameUpdate was
  // sent, and interpolation assumes localAnchorAt marks "now, when that
  // snapshot was true". Anchoring after an awaited fetch (switching to a
  // preset not already cached, a slow network, a server busy with a sync
  // push) silently adds the fetch's own latency as extra elapsed time, so
  // the displayed clock visibly jumps ahead of Shufflepolo's real one by
  // however long that fetch happened to take - worse the more it varies
  // run to run, which looks exactly like "drifts out of sync on reload".
  gameState._clockAnchorAt = Date.now();
  gameState._currentClock = gameState.clock ? { ...gameState.clock, localAnchorAt: gameState._clockAnchorAt } : null;
  latestGameState = gameState;

  // Operator turned the scorebug off (gameState.scorebugHidden, from the
  // Scorebug panel on /control or /dashboard): hide both layers and leave
  // the stage black for the luma key. Neither layer is torn down - the
  // overlay iframe keeps its src and live socket, and shownOverlayId is
  // left alone, so showing it again is instant and doesn't reload the
  // overlay page. The ladder and commercial break are separate layers and
  // unaffected.
  if (gameState.scorebugHidden) {
    presetLayerEl.style.display = 'none';
    overlayFrameEl.style.display = 'none';
    debugState.renderCount++;
    debugState.renderedVersion = 'hidden (scorebug off)';
    renderDebugOverlay();
    return;
  }

  if (gameState.activeKind === 'overlay' && gameState.activeId) {
    // /overlay/:id is a fully self-contained live page (own socket
    // connection, own overlay-bind.js data binding) - just point the
    // iframe at it and get out of the way. Only reassign .src when the
    // overlay ID actually changed, not on every gameUpdate, so the
    // overlay's own live connection isn't torn down and reconnected on
    // every score change. #presetLayer is left alone (not torn down) so
    // switching back to a preset doesn't need to refetch/rebuild it from
    // scratch if nothing about it changed - it's just hidden.
    presetLayerEl.style.display = 'none';
    overlayFrameEl.style.display = 'block';
    if (shownOverlayId !== gameState.activeId) {
      overlayFrameEl.src = '/overlay/' + gameState.activeId;
      shownOverlayId = gameState.activeId;
    }
    loadedPreset = null;
    debugState.renderCount++;
    debugState.renderedVersion = 'overlay:' + gameState.activeId;
    renderDebugOverlay();
    return;
  }

  // Not an overlay (preset, or nothing active) - hide the iframe and fall
  // back to the legacy element-based render path, into #presetLayer (a
  // dedicated child of #stage, never touched by the overlay branch above,
  // so renderPreset's own "wipe every child" teardown can never reach
  // #overlayFrame).
  overlayFrameEl.style.display = 'none';
  presetLayerEl.style.display = 'block';
  shownOverlayId = null;

  const myGeneration = ++renderGeneration;
  const preset = await loadActivePreset(gameState.activeKind === 'preset' ? gameState.activeId : null);
  if(myGeneration !== renderGeneration){
    console.log("Discarding stale render (a newer gameUpdate arrived while this preset fetch was in flight)");
    return;
  }
  loadedPreset = preset;

  renderPreset(preset, gameState, presetLayerEl);

  debugState.renderCount++;
  debugState.renderedVersion = preset._debugVersion;
  renderDebugOverlay();
}

/* ---- commercial break (unchanged from prior display.html) ---- */
const commercialOverlayEl = document.getElementById('commercialOverlay');
const commercialVideoEl = document.getElementById('commercialVideo');
let isCommercialActive = false;

function startCommercialBreak(videoPath) {
    console.log('Starting commercial break with video:', videoPath);
    commercialVideoEl.src = videoPath;
    commercialVideoEl.muted = false;
    commercialVideoEl.controls = false;
    commercialVideoEl.style.pointerEvents = 'none';

    commercialOverlayEl.classList.add('active');
    isCommercialActive = true;

    commercialVideoEl.addEventListener('ended', () => {
        stopCommercialBreak(true);
    }, { once: true });

    commercialVideoEl.addEventListener('error', (e) => {
        console.error('Video error:', e);
        stopCommercialBreak(true);
    }, { once: true });

    commercialVideoEl.play().catch(e => {
        console.error('Video play error:', e);
    });
}

function stopCommercialBreak(notifyServer = true) {
    console.log('Stopping commercial break, notifyServer:', notifyServer);
    commercialOverlayEl.classList.remove('active');
    commercialVideoEl.src = '';
    commercialVideoEl.pause();
    document.getElementById('stage').style.visibility = 'visible';

    if (notifyServer && isCommercialActive) {
        console.log('Notifying server that commercial break ended');
        socket.emit('stopCommercialBreak');
    }
    isCommercialActive = false;
}

socket.on('gameUpdate', renderDisplay);
// Operator-requested reload (control page's "Refresh display" button, or
// POST /api/display/reload): same in-place reload as a server restart.
socket.on('reloadDisplay', () => {
  console.log("Reload requested - reloading display page");
  window.location.reload();
});

// Go black immediately when break is starting, before ATEM switches to this input
socket.on('displayBlack', function() {
    document.getElementById('stage').style.visibility = 'hidden';
});

socket.on('reloadPage', function() {
    window.location.reload();
});

// Fired by server.js's writeOverlay() whenever a logo, the whole-block
// transform, or the active version of the overlay CURRENTLY SHOWING here
// changes (server-side checks it's the active one before emitting, so
// this never fires for edits to some other draft overlay). Without this,
// #overlayFrame has no signal that its own content changed - its .src is
// otherwise only reassigned when gameState.activeId itself changes to a
// DIFFERENT overlay (see renderDisplay's shownOverlayId check) - so a
// zoom/position/logo edit to the overlay already on screen would
// otherwise sit there stale until something else happened to force a
// reload. Reload only when it's actually the one currently shown (the
// overlay branch of renderDisplay already guards overlayFrameEl.src the
// same way).
socket.on('overlayContentChanged', function(data) {
    if (shownOverlayId === data.id) {
        overlayFrameEl.src = '/overlay/' + data.id + '?t=' + Date.now();
    }
});
</script>
</body>
</html>
