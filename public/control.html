<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }

        .team-section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }

        .team-section.right {
            border-left-color: #f44336;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team-label {
            font-size: 18px;
            font-weight: bold;
        }

        .team-name-input {
            background: #3a3a3a;
            border: 2px solid #555;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 15px;
        }

        .team-name-input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .team-section.right .team-name-input:focus {
            border-color: #f44336;
        }

        .color-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-picker {
            width: 60px;
            height: 40px;
            border: 2px solid #555;
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }

        .color-picker:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .team-section.right .color-picker:focus {
            border-color: #f44336;
        }

        .color-presets {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .presets-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }

        .preset-colors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .preset-color {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            border: 2px solid #555;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .preset-color:hover {
            border-color: #fff;
        }

        .preset-color.selected {
            border-color: #4CAF50;
            border-width: 3px;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
            background: #3a3a3a;
            border-radius: 12px;
            padding: 10px;
        }

        .score-button {
            background: #4CAF50;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            width: 60px;
            height: 60px;
            cursor: pointer;
            transition: background-color 0.2s;
            user-select: none;
        }

        .score-button:hover {
            background: #45a049;
        }

        .score-button:active {
            transform: scale(0.95);
        }

        .score-button.minus {
            background: #f44336;
        }

        .score-button.minus:hover {
            background: #da190b;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .action-button {
            flex: 1;
            background: #666;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background: #777;
        }

        .action-button.reset {
            background: #ff9800;
        }

        .action-button.reset:hover {
            background: #f57c00;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            background: #2a2a2a;
        }

        .status.connected {
            background: #1b5e20;
        }

        .status.disconnected {
            background: #c62828;
        }

        /* Commercial Break Section */
        .commercial-section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #9c27b0;
        }

        .commercial-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }

        .video-selector {
            background: #3a3a3a;
            border: 2px solid #555;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .video-selector:focus {
            outline: none;
            border-color: #9c27b0;
        }

        .commercial-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .commercial-button {
            background: #9c27b0;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 24px;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
        }

        .commercial-button:hover {
            background: #8e24aa;
        }

        .commercial-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .commercial-button.stop {
            background: #f44336;
        }

        .commercial-button.stop:hover {
            background: #da190b;
        }

        .commercial-status {
            flex: 1;
            text-align: center;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            background: #3a3a3a;
        }

        .commercial-status.active {
            background: #9c27b0;
        }

        /* ATEM Control Section */
        .atem-section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #ff5722;
        }

        .atem-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }

        .atem-status-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .atem-status {
            flex: 1;
            text-align: center;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            background: #c62828;
        }

        .atem-status.connected {
            background: #2e7d32;
        }

        .atem-button {
            background: #ff5722;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .atem-button:hover {
            background: #e64a19;
        }

        .atem-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .atem-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-controls label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .input-button {
            background: #666;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 50px;
            height: 40px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-button:hover {
            background: #777;
        }

        .input-button.active {
            background: #ff5722;
        }

        .input-button.graphics {
            background: #4caf50;
            width: 80px;
        }

        .input-button.graphics:hover {
            background: #45a049;
        }

        .key-controls {
            display: flex;
            align-items: center;
        }

        .key-button {
            background: #666;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .key-button:hover {
            background: #777;
        }

        .key-button.active {
            background: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scorebored</h1>

        <div class="team-section">
            <div class="team-header">
                <span class="team-label">Left Team</span>
            </div>
            <input type="text" class="team-name-input" id="leftTeamInput" placeholder="Team name" maxlength="16">
            <div class="color-controls">
                <label>Color:</label>
                <input type="color" class="color-picker" id="leftColorPicker" value="#2E7D32">
            </div>
            <div class="score-controls">
                <button class="score-button minus" onclick="updateScore('left', -1)">-</button>
                <div class="score-display" id="leftScore">0</div>
                <button class="score-button" onclick="updateScore('left', 1)">+</button>
            </div>
        </div>

        <div class="team-section right">
            <div class="team-header">
                <span class="team-label">Right Team</span>
            </div>
            <input type="text" class="team-name-input" id="rightTeamInput" placeholder="Team name" maxlength="16">
            <div class="color-controls">
                <label>Color:</label>
                <input type="color" class="color-picker" id="rightColorPicker" value="#B71C1C">
            </div>
            <div class="score-controls">
                <button class="score-button minus" onclick="updateScore('right', -1)">-</button>
                <div class="score-display" id="rightScore">0</div>
                <button class="score-button" onclick="updateScore('right', 1)">+</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-button" onclick="swapSides()">Swap Sides</button>
            <button class="action-button reset" onclick="resetGame()">Reset Game</button>
        </div>

        <div class="commercial-section">
            <div class="commercial-header">Commercial Break</div>
            <select class="video-selector" id="videoSelector">
                <option value="">Loading videos...</option>
            </select>
            <div class="commercial-controls">
                <button class="commercial-button" id="startCommercialBtn" onclick="startCommercialBreak()" disabled>Start Break</button>
                <button class="commercial-button stop" id="stopCommercialBtn" onclick="stopCommercialBreak()" disabled>Stop Break</button>
                <div class="commercial-status" id="commercialStatus">Ready</div>
            </div>
        </div>

        <div class="atem-section">
            <div class="atem-header">ATEM Switcher Control</div>
            <div class="atem-status-row">
                <div class="atem-status" id="atemStatus">Disconnected</div>
            </div>
            <div class="atem-controls">
                <div class="input-controls">
                    <label>Switch to Input:</label>
                    <div class="input-buttons">
                        <button class="input-button graphics" onclick="switchInput(1)">Graphics</button>
                        <button class="input-button" onclick="switchInput(2)">2</button>
                        <button class="input-button" onclick="switchInput(3)">3</button>
                        <button class="input-button" onclick="switchInput(4)">4</button>
                        <button class="input-button" onclick="switchInput(5)">5</button>
                        <button class="input-button" onclick="switchInput(6)">6</button>
                    </div>
                </div>
                <div class="key-controls">
                    <button class="key-button" id="downstreamKeyBtn" onclick="toggleDownstreamKey()">Downstream Key: OFF</button>
                </div>
            </div>
        </div>

        <div class="color-presets">
            <div class="presets-header">Team Color Presets</div>
            <div class="preset-colors" id="presetColors">
                <!-- Preset colors will be populated by JavaScript -->
            </div>
        </div>

        <div class="color-presets">
            <div class="presets-header">Global Colors</div>
            <div class="color-controls">
                <label>Text Color:</label>
                <input type="color" class="color-picker" id="textColorPicker" value="#ffffff">
            </div>
            <div class="color-controls">
                <label>Background Bar:</label>
                <input type="color" class="color-picker" id="backgroundColorPicker" value="#808080">
            </div>
        </div>

        <div class="status" id="status">Connecting...</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const leftTeamInput = document.getElementById('leftTeamInput');
        const rightTeamInput = document.getElementById('rightTeamInput');
        const leftScoreEl = document.getElementById('leftScore');
        const rightScoreEl = document.getElementById('rightScore');
        const statusEl = document.getElementById('status');
        const leftColorPicker = document.getElementById('leftColorPicker');
        const rightColorPicker = document.getElementById('rightColorPicker');
        const textColorPicker = document.getElementById('textColorPicker');
        const backgroundColorPicker = document.getElementById('backgroundColorPicker');
        const presetColorsEl = document.getElementById('presetColors');
        const videoSelector = document.getElementById('videoSelector');
        const startCommercialBtn = document.getElementById('startCommercialBtn');
        const stopCommercialBtn = document.getElementById('stopCommercialBtn');
        const commercialStatus = document.getElementById('commercialStatus');
        const atemStatus = document.getElementById('atemStatus');
        const downstreamKeyBtn = document.getElementById('downstreamKeyBtn');
        
        // Preset colors for bicycle polo teams
        const colorPresets = [
            '#2E7D32', '#B71C1C', '#1976D2', '#FF8F00', 
            '#7B1FA2', '#D32F2F', '#388E3C', '#F57C00',
            '#512DA8', '#1565C0', '#00796B', '#795548',
            '#455A64', '#E64A19', '#C2185B', '#8E24AA'
        ];
        
        // Load saved colors from localStorage
        let savedColors = JSON.parse(localStorage.getItem('scoreboardColors')) || [];

        // Commercial break functionality
        async function loadAvailableVideos() {
            try {
                const response = await fetch('/api/videos');
                const videos = await response.json();

                videoSelector.innerHTML = '';

                if (videos.length === 0) {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'No videos found (add MP4 files to public/videos/)';
                    option.disabled = true;
                    videoSelector.appendChild(option);
                    startCommercialBtn.disabled = true;
                } else {
                    // Add default option
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Select a video...';
                    videoSelector.appendChild(defaultOption);

                    // Add video options
                    videos.forEach(video => {
                        const option = document.createElement('option');
                        option.value = video.path;
                        option.textContent = video.name;
                        videoSelector.appendChild(option);
                    });

                    updateCommercialButtons();
                }
            } catch (error) {
                console.error('Error loading videos:', error);
                videoSelector.innerHTML = '<option value="" disabled>Error loading videos</option>';
                startCommercialBtn.disabled = true;
            }
        }

        function updateCommercialButtons() {
            const hasVideoSelected = videoSelector.value !== '';
            startCommercialBtn.disabled = !hasVideoSelected;
        }

        function startCommercialBreak() {
            const selectedVideo = videoSelector.value;
            if (selectedVideo) {
                socket.emit('startCommercialBreak', { videoPath: selectedVideo });
            }
        }

        function stopCommercialBreak() {
            socket.emit('stopCommercialBreak');
        }

        // ATEM Control Functions
        function connectAtem() {
            console.log('Requesting ATEM connection...');
            socket.emit('atemConnect');
        }

        function switchInput(inputNumber) {
            console.log(`Switching to input: ${inputNumber}`);
            socket.emit('atemSwitchInput', { input: inputNumber });
        }

        function toggleDownstreamKey() {
            console.log('Toggling downstream key...');
            socket.emit('atemToggleDownstreamKey');
        }

        function updateAtemStatus(gameState) {
            if (gameState.atemStatus) {
                const atemConnected = gameState.atemStatus.connected;

                // Update status display
                atemStatus.textContent = atemConnected ? 'Connected' : 'Disconnected';
                atemStatus.className = atemConnected ? 'atem-status connected' : 'atem-status';

                // Update input buttons
                const inputButtons = document.querySelectorAll('.input-button');
                inputButtons.forEach(btn => {
                    btn.classList.remove('active');
                    btn.disabled = !atemConnected;
                });

                if (atemConnected && gameState.atemStatus.currentInput) {
                    const activeBtn = document.querySelector(`.input-button[onclick="switchInput(${gameState.atemStatus.currentInput})"]`);
                    if (activeBtn) {
                        activeBtn.classList.add('active');
                    }
                }

                // Update downstream key button
                downstreamKeyBtn.disabled = !atemConnected;
                if (atemConnected) {
                    const keyEnabled = gameState.atemStatus.downstreamKeyEnabled;
                    downstreamKeyBtn.textContent = `Downstream Key: ${keyEnabled ? 'ON' : 'OFF'}`;
                    downstreamKeyBtn.className = keyEnabled ? 'key-button active' : 'key-button';
                }
            }
        }

        function updateCommercialStatus(gameState) {
            if (gameState.commercialBreak && gameState.commercialBreak.active) {
                commercialStatus.textContent = 'Commercial Playing';
                commercialStatus.classList.add('active');
                startCommercialBtn.disabled = true;
                stopCommercialBtn.disabled = false;
                videoSelector.disabled = true;
            } else {
                commercialStatus.textContent = 'Ready';
                commercialStatus.classList.remove('active');
                stopCommercialBtn.disabled = true;
                videoSelector.disabled = false;
                updateCommercialButtons();
            }
        }
        
        function initializeColorPresets() {
            presetColorsEl.innerHTML = '';
            
            // Add saved colors first
            savedColors.forEach((color, index) => {
                addPresetColor(color, true, index);
            });
            
            // Add default presets
            colorPresets.forEach(color => {
                if (!savedColors.includes(color)) {
                    addPresetColor(color, false);
                }
            });
        }
        
        function addPresetColor(color, isSaved, savedIndex) {
            const colorDiv = document.createElement('div');
            colorDiv.className = 'preset-color';
            colorDiv.style.backgroundColor = color;
            colorDiv.title = color;
            
            colorDiv.addEventListener('click', () => {
                // Apply to currently selected color picker or last focused one
                if (document.activeElement === leftColorPicker || lastFocusedPicker === 'left') {
                    leftColorPicker.value = color;
                    updateTeamColor('left', color);
                } else {
                    rightColorPicker.value = color;
                    updateTeamColor('right', color);
                }
            });
            
            if (isSaved && savedIndex !== undefined) {
                // Add delete functionality for saved colors
                colorDiv.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (confirm('Remove this color from saved presets?')) {
                        savedColors.splice(savedIndex, 1);
                        localStorage.setItem('scoreboardColors', JSON.stringify(savedColors));
                        initializeColorPresets();
                    }
                });
            }
            
            presetColorsEl.appendChild(colorDiv);
        }
        
        let lastFocusedPicker = 'left';
        
        function saveCurrentColor(color) {
            if (!savedColors.includes(color)) {
                savedColors.unshift(color); // Add to beginning
                if (savedColors.length > 8) savedColors.pop(); // Keep only 8 saved colors
                localStorage.setItem('scoreboardColors', JSON.stringify(savedColors));
                initializeColorPresets();
            }
        }
        
        function updateTeamColor(side, color) {
            socket.emit('updateTeamColor', { side, color });
            saveCurrentColor(color);
        }
        
        socket.on('connect', () => {
            console.log('🔌 Socket connected');
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
        });

        socket.on('disconnect', () => {
            console.log('❌ Socket disconnected');
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
        });
        
        socket.on('gameUpdate', (gameState) => {
            console.log('📡 Received game update:', gameState);
            leftTeamInput.value = gameState.leftTeam;
            rightTeamInput.value = gameState.rightTeam;
            leftScoreEl.textContent = gameState.leftScore;
            rightScoreEl.textContent = gameState.rightScore;

            if (gameState.leftColor) {
                leftColorPicker.value = gameState.leftColor;
            }
            if (gameState.rightColor) {
                rightColorPicker.value = gameState.rightColor;
            }
            if (gameState.textColor) {
                textColorPicker.value = gameState.textColor;
            }
            if (gameState.backgroundColor) {
                backgroundColorPicker.value = gameState.backgroundColor;
            }

            // Update commercial break status
            updateCommercialStatus(gameState);

            // Update ATEM status
            updateAtemStatus(gameState);
        });
        
        leftTeamInput.addEventListener('input', (e) => {
            socket.emit('updateTeamName', { side: 'left', name: e.target.value });
        });
        
        rightTeamInput.addEventListener('input', (e) => {
            socket.emit('updateTeamName', { side: 'right', name: e.target.value });
        });
        
        // Color picker event listeners
        leftColorPicker.addEventListener('change', (e) => {
            updateTeamColor('left', e.target.value);
        });
        
        rightColorPicker.addEventListener('change', (e) => {
            updateTeamColor('right', e.target.value);
        });
        
        leftColorPicker.addEventListener('focus', () => {
            lastFocusedPicker = 'left';
        });
        
        rightColorPicker.addEventListener('focus', () => {
            lastFocusedPicker = 'right';
        });
        
        // Use change event only (fires when user finishes selecting)
        textColorPicker.addEventListener('change', (e) => {
            try {
                console.log('Sending text color update:', e.target.value);
                socket.emit('updateGlobalColor', { type: 'text', color: e.target.value });
            } catch (error) {
                console.error('Error sending text color:', error);
            }
        });
        
        backgroundColorPicker.addEventListener('change', (e) => {
            try {
                console.log('Sending background color update:', e.target.value);
                socket.emit('updateGlobalColor', { type: 'background', color: e.target.value });
            } catch (error) {
                console.error('Error sending background color:', error);
            }
        });
        
        function updateScore(side, change) {
            console.log('📱 Sending score update:', side, change);
            socket.emit('updateScore', { side, change });
        }
        
        function swapSides() {
            socket.emit('swapSides');
        }
        
        function resetGame() {
            if (confirm('Reset scores to 0-0?')) {
                socket.emit('resetGame');
            }
        }
        
        // Video selector event listener
        videoSelector.addEventListener('change', updateCommercialButtons);

        // Initialize when page loads
        initializeColorPresets();
        loadAvailableVideos();
    </script>
</body>
</html>
