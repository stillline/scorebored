<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Bracket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 24px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
        }

        .nav-links a:hover { color: #fff; }

        .section-header {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            padding: 6px 0 4px 0;
            margin-top: 16px;
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
        }

        .matchup-list {
            list-style: none;
        }

        .matchup-item {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }

        .matchup-item.drag-over {
            background: #3a3a3a;
            outline: 2px dashed #555;
        }

        .matchup-item.dragging {
            opacity: 0.4;
        }

        .drag-handle {
            cursor: grab;
            color: #555;
            font-size: 18px;
            flex-shrink: 0;
            user-select: none;
            padding: 0 2px;
        }

        .drag-handle:active { cursor: grabbing; }

        .match-num {
            font-size: 12px;
            color: #666;
            min-width: 28px;
            flex-shrink: 0;
        }

        .match-time {
            font-size: 12px;
            color: #888;
            min-width: 40px;
            flex-shrink: 0;
        }

        .team-block {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .team-color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 2px solid #555;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            background: none;
            position: relative;
            overflow: hidden;
        }

        .team-color-swatch input[type="color"] {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .team-name-input {
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            padding: 6px 8px;
            font-size: 14px;
            flex: 1;
            min-width: 0;
        }

        .team-name-input:focus {
            outline: none;
            border-color: #888;
        }

        .vs-label {
            font-size: 11px;
            color: #555;
            font-weight: bold;
            flex-shrink: 0;
        }

        .load-btn {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .load-btn:hover { background: #388e3c; }
        .load-btn:active { background: #1b5e20; }

        .load-btn.loaded {
            background: #1565c0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
            line-height: 1;
            padding: 0 2px;
            transition: color 0.15s;
        }

        .delete-btn:hover { color: #f44336; }

        .actions-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .add-btn {
            background: #333;
            color: white;
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            transition: background 0.15s, border-color 0.15s;
        }

        .add-btn:hover {
            background: #3a3a3a;
            border-color: #888;
        }

        .save-btn {
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
        }

        .save-btn:hover { background: #1976d2; }

        .save-status {
            font-size: 13px;
            color: #888;
            align-self: center;
            margin-left: 4px;
        }

        .save-status.ok { color: #4caf50; }
        .save-status.err { color: #f44336; }

        .challonge-panel {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 20px;
        }

        .challonge-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .challonge-panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }

        .challonge-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .challonge-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .challonge-toggle-slider {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            background: #444;
            border-radius: 11px;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .challonge-toggle-slider::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: #ccc;
            border-radius: 50%;
            transition: transform 0.15s, background 0.15s;
        }

        .challonge-toggle input:checked + .challonge-toggle-slider {
            background: #2e7d32;
        }

        .challonge-toggle input:checked + .challonge-toggle-slider::before {
            transform: translateX(18px);
            background: #fff;
        }

        .challonge-toggle input:focus-visible + .challonge-toggle-slider {
            outline: 2px solid #888;
            outline-offset: 2px;
        }

        .challonge-row {
            margin-bottom: 12px;
        }

        .challonge-row:last-of-type {
            margin-bottom: 0;
        }

        .challonge-row-label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 5px;
        }

        .challonge-row-inline {
            display: flex;
            gap: 8px;
        }

        .challonge-fields input[type="text"],
        .challonge-fields input[type="password"],
        .challonge-fields select {
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            padding: 8px 10px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
        }

        .challonge-fields select {
            text-overflow: ellipsis;
        }

        .challonge-fields input:focus, .challonge-fields select:focus { outline: none; border-color: #888; }

        .challonge-save-btn, .challonge-list-btn {
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .challonge-list-btn {
            background: #333;
            border: 1px solid #555;
        }

        .challonge-save-btn:hover { background: #1976d2; }
        .challonge-list-btn:hover { background: #3a3a3a; border-color: #888; }

        .challonge-tourney-list {
            display: none;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 8px;
            font-size: 12px;
        }

        .challonge-tourney-list.visible { display: block; }

        .challonge-tourney-list-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .challonge-tourney-list-row:last-child { border-bottom: none; }

        .challonge-tourney-list-name {
            color: #ccc;
        }

        .challonge-tourney-list-meta {
            color: #666;
            font-size: 11px;
        }

        .challonge-tourney-list-slug {
            color: #64b5f6;
            font-family: monospace;
            user-select: all;
            flex-shrink: 0;
        }

        .challonge-status {
            font-size: 12px;
            color: #888;
            margin-top: 12px;
        }

        .challonge-status.idle { color: #4caf50; }
        .challonge-status.error { color: #f44336; }
    </style>
</head>
<body>
<div class="container">
    <h1>Tournament Schedule</h1>
    <div class="nav-links">
        <a href="/control">Control</a>
        <a href="/bracket">Schedule</a>
        <a href="/display" target="_blank">Display</a>
        <a href="/network">Network</a>
        <a href="/teams">Teams</a>
        <a href="/bracket-viewer" target="_blank">Bracket Viewer</a>
            <a href="http://10.42.0.1:8000/" target="_blank">Companion</a>
    </div>

    <div class="challonge-panel">
        <div class="challonge-panel-header">
            <span class="challonge-panel-title">Challonge Sync</span>

        </div>

            <div class="challonge-row">
                <label class="challonge-row-label" for="challonge-api-key">API key</label>

                    <input type="password" id="challonge-api-key" placeholder="API key">
                    <button class="challonge-list-btn" id="challonge-list-btn">List Tournaments</button>

            </div>
            <div class="challonge-row">
                <label class="challonge-row-label" for="challonge-tourney">Tournament slug</label>
                <input type="text" id="challonge-tourney" placeholder="Tournament slug or id">
            </div>
            <div class="challonge-row">
                <button class="challonge-save-btn" id="challonge-save-btn">Save</button>
            </div>
        </div>
        <div class="challonge-status" id="challonge-status"></div>
    </div>

    <div class="challonge-panel">
        <div class="challonge-panel-header">
            <span class="challonge-panel-title">Podium Sync</span>
            <label class="challonge-toggle">
                <input type="checkbox" id="podium-toggle">
                <span class="challonge-toggle-slider"></span>
                <span id="podium-toggle-label">Disabled</span>
            </label>
        </div>
        <div class="challonge-fields">
            <div class="challonge-row">
                <label class="challonge-row-label" for="podium-api-key">API key</label>
                <input type="password" id="podium-api-key" placeholder="API key">
            </div>
            <div class="challonge-row">
                <label class="challonge-row-label" for="podium-tournament">Tournament slug</label>
                <input type="text" id="podium-tournament" placeholder="Tournament slug">
            </div>
            <div class="challonge-row">
                <label class="challonge-row-label" for="podium-court">Court</label>
                <input type="text" id="podium-court" placeholder="Court name, e.g. 2">
            </div>
            <div class="challonge-row">
                <button class="challonge-save-btn" id="podium-save-btn">Save</button>
            </div>
        </div>
        <div class="challonge-status" id="podium-status"></div>
    </div>

    <div id="matchup-list-container"></div>

    <div class="actions-bar">
        <button class="add-btn" id="add-btn">+ Add Matchup</button>
        <button class="save-btn" id="save-btn">Save Schedule</button>
        <span class="save-status" id="save-status"></span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const DEFAULT_LEFT_COLOR  = '#292929';
const DEFAULT_RIGHT_COLOR = '#ebebeb';

let matchups = [];
let currentlyLoaded = null;

// ── Default matchups — Court A, SWQ Tournament ──
const DEFAULT_MATCHUPS = [
    { group: 'Day 1' },
    { num: 1,  time: '9:00',  left: 'Gulls',            right: 'Silky Mitts',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },

    { num: 3,  time: '10:00', left: 'Mothership',        right: 'Best Bet',         lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 4,  time: '10:30', left: 'Gulls',             right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 5,  time: '11:00', left: 'Silky Mitts',       right: 'Best Bet',         lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 6,  time: '11:30', left: 'Copperhead',        right: 'Valley Boyz',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 7,  time: '12:00', left: 'Gulls',             right: 'Best Bet',         lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 8,  time: '12:30', left: 'A Swig and A Miss', right: 'Valley Boyz',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 9,  time: '13:00', left: 'Silky Mitts',       right: 'Beehive Baes',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 10, time: '13:30', left: 'Gulls',             right: 'Valley Boyz',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 11, time: '14:00', left: 'Best Bet',          right: 'Beehive Baes',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 12, time: '14:30', left: 'A Swig and A Miss', right: 'Nemesis',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 13, time: '15:00', left: 'Gulls',             right: 'Beehive Baes',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 14, time: '15:30', left: 'Valley Boyz',       right: 'Nemesis',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 15, time: '16:00', left: 'Best Bet',          right: 'Yoke',             lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 16, time: '16:30', left: 'Gulls',             right: 'Nemesis',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 17, time: '17:00', left: 'Beehive Baes',      right: 'Yoke',             lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 18, time: '17:30', left: 'Valley Boyz',       right: 'Golden Geese',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 19, time: '18:00', left: 'Gulls',             right: 'Yoke',             lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 20, time: '18:30', left: 'Silky Mitts',       right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { group: 'Day 2' },
    { num: 21, time: '9:00',  left: 'Nemesis',           right: 'Golden Geese',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 22, time: '9:30',  left: 'Beehive Baes',      right: 'Slither',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 23, time: '10:00', left: 'Gulls',             right: 'Golden Geese',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 24, time: '10:30', left: 'Yoke',              right: 'Slither',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 25, time: '11:00', left: 'Nemesis',           right: 'Mothership',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 26, time: '11:30', left: 'Gulls',             right: 'Slither',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 27, time: '12:00', left: 'Golden Geese',      right: 'Mothership',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 28, time: '12:30', left: 'Yoke',              right: 'Copperhead',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 29, time: '13:00', left: 'Gulls',             right: 'Mothership',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 30, time: '13:30', left: 'Slither',           right: 'Copperhead',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 31, time: '14:00', left: 'Golden Geese',      right: 'Silky Mitts',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 32, time: '14:30', left: 'Gulls',             right: 'Copperhead',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 33, time: '15:00', left: 'Copperhead',        right: 'Silky Mitts',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 34, time: '15:30', left: 'Slither',           right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
];

// ── Fetch saved schedule or use defaults ──
let isReadOnly = false;

async function loadSchedule() {
    try {
        const res = await fetch('/api/bracket');
        if (res.ok) {
            const data = await res.json();
            matchups = data.matchups || DEFAULT_MATCHUPS;
            isReadOnly = data.source === 'challonge';
        } else {
            matchups = DEFAULT_MATCHUPS;
            isReadOnly = false;
        }
    } catch (e) {
        matchups = DEFAULT_MATCHUPS;
        isReadOnly = false;
    }
    render();
    renderReadOnlyNotice();
}

function renderReadOnlyNotice() {
    const actionsBar = document.querySelector('.actions-bar');
    let notice = document.getElementById('challonge-readonly-notice');
    if (isReadOnly) {
        actionsBar.style.display = 'none';
        if (!notice) {
            notice = document.createElement('div');
            notice.id = 'challonge-readonly-notice';
            notice.className = 'challonge-status';
            notice.style.textAlign = 'center';
            notice.style.marginTop = '16px';
            notice.textContent = 'Schedule is synced live from Challonge — editing is disabled while sync is enabled.';
            document.querySelector('.container').appendChild(notice);
        }
    } else {
        actionsBar.style.display = '';
        if (notice) notice.remove();
    }
}

// ── Render ──
function render() {
    const container = document.getElementById('matchup-list-container');
    container.innerHTML = '';

    let currentGroup = null;

    matchups.forEach((m, idx) => {
        if (m.group !== undefined) {
            // Section header row
            const header = document.createElement('div');
            header.className = 'section-header';
            header.textContent = m.group;
            container.appendChild(header);
            currentGroup = m.group;
            return;
        }

        const item = document.createElement('div');
        item.className = 'matchup-item';
        item.draggable = !isReadOnly;
        item.dataset.idx = idx;

        const colorSwatch = (color, side) => isReadOnly
            ? `<span class="team-color-swatch" style="background:${color}"></span>`
            : `<button class="team-color-swatch" style="background:${color}" title="Team color">
                   <input type="color" value="${color}" data-idx="${idx}" data-side="${side}">
               </button>`;
        const nameField = (name, field, placeholder) => isReadOnly
            ? `<span class="team-name-input" style="display:flex;align-items:center;">${escHtml(name)}</span>`
            : `<input class="team-name-input" type="text" value="${escHtml(name)}" data-idx="${idx}" data-field="${field}" placeholder="${placeholder}">`;

        item.innerHTML = `
            <span class="drag-handle" title="Drag to reorder" style="${isReadOnly ? 'visibility:hidden' : ''}">⠿</span>
            <span class="match-num">#${m.num || '—'}</span>
            <span class="match-time">${m.time || ''}</span>
            <div class="team-block">
                ${colorSwatch(m.lc, 'lc')}
                ${nameField(m.left, 'left', 'Left team')}
            </div>
            <span class="vs-label">VS</span>
            <div class="team-block">
                ${colorSwatch(m.rc, 'rc')}
                ${nameField(m.right, 'right', 'Right team')}
            </div>
            <button class="load-btn${currentlyLoaded === idx ? ' loaded' : ''}" data-idx="${idx}">
                ${currentlyLoaded === idx ? 'Now Playing' : 'Load'}
            </button>
            <button class="delete-btn" data-idx="${idx}" title="Delete" style="${isReadOnly ? 'visibility:hidden' : ''}">✕</button>
        `;

        if (!isReadOnly) {
            // Color swatch live preview
            item.querySelectorAll('input[type="color"]').forEach(picker => {
                picker.addEventListener('input', e => {
                    const i = parseInt(e.target.dataset.idx);
                    const side = e.target.dataset.side;
                    matchups[i][side] = e.target.value;
                    e.target.closest('.team-color-swatch').style.background = e.target.value;
                });
            });

            // Team name edits
            item.querySelectorAll('.team-name-input').forEach(input => {
                input.addEventListener('input', e => {
                    const i = parseInt(e.target.dataset.idx);
                    const field = e.target.dataset.field;
                    matchups[i][field] = e.target.value;
                });
            });

            // Time edit — inline on the span (double-click to edit)
            const timeSpan = item.querySelector('.match-time');
            timeSpan.style.cursor = 'pointer';
            timeSpan.title = 'Click to edit time';
            timeSpan.addEventListener('click', () => {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.value = matchups[idx].time || '';
                inp.style.cssText = 'width:52px;background:#3a3a3a;border:1px solid #666;border-radius:4px;color:white;padding:2px 4px;font-size:12px;';
                timeSpan.replaceWith(inp);
                inp.focus();
                inp.select();
                const commit = () => {
                    matchups[idx].time = inp.value;
                    inp.replaceWith(timeSpan);
                    timeSpan.textContent = inp.value;
                };
                inp.addEventListener('blur', commit);
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
            });

            // Delete button
            item.querySelector('.delete-btn').addEventListener('click', () => {
                matchups.splice(idx, 1);
                if (currentlyLoaded === idx) currentlyLoaded = null;
                else if (currentlyLoaded > idx) currentlyLoaded--;
                render();
            });

            // Drag-and-drop
            item.addEventListener('dragstart', onDragStart);
            item.addEventListener('dragover', onDragOver);
            item.addEventListener('drop', onDrop);
            item.addEventListener('dragend', onDragEnd);
        }

        // Load button — always active, Challonge mode or not
        item.querySelector('.load-btn').addEventListener('click', () => loadMatchup(idx));

        container.appendChild(item);
    });
}

function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Load a matchup into the scoreboard ──
function loadMatchup(idx) {
    const m = matchups[idx];
    if (!m || m.group !== undefined) return;

    socket.emit('loadMatchup', {
        leftTeam:   m.left,
        rightTeam:  m.right,
        leftColor:  m.lc,
        rightColor: m.rc,
        matchupIndex: idx,
    });

    currentlyLoaded = idx;
    render();
}

// ── Add new blank matchup ──
document.getElementById('add-btn').addEventListener('click', () => {
    matchups.push({
        num: '',
        time: '',
        left: 'Team A',
        right: 'Team B',
        lc: DEFAULT_LEFT_COLOR,
        rc: DEFAULT_RIGHT_COLOR,
    });
    render();
    // Scroll to bottom
    window.scrollTo(0, document.body.scrollHeight);
});

// ── Save schedule ──
document.getElementById('save-btn').addEventListener('click', async () => {
    const status = document.getElementById('save-status');
    status.textContent = 'Saving…';
    status.className = 'save-status';
    try {
        const res = await fetch('/api/bracket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matchups }),
        });
        if (res.ok) {
            status.textContent = 'Saved ✓';
            status.className = 'save-status ok';
        } else {
            throw new Error('Server error');
        }
    } catch (e) {
        status.textContent = 'Save failed';
        status.className = 'save-status err';
    }
    setTimeout(() => { status.textContent = ''; status.className = 'save-status'; }, 3000);
});

// ── Drag-and-drop reorder ──
let dragSrcIdx = null;

function onDragStart(e) {
    dragSrcIdx = parseInt(e.currentTarget.dataset.idx);
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.matchup-item').forEach(el => el.classList.remove('drag-over'));
    e.currentTarget.classList.add('drag-over');
}

function onDrop(e) {
    e.preventDefault();
    const targetIdx = parseInt(e.currentTarget.dataset.idx);
    if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;

    // Reorder only among non-group-header entries
    const [moved] = matchups.splice(dragSrcIdx, 1);
    matchups.splice(targetIdx, 0, moved);

    // Update currentlyLoaded index
    if (currentlyLoaded !== null) {
        if (currentlyLoaded === dragSrcIdx) {
            currentlyLoaded = targetIdx;
        } else if (dragSrcIdx < targetIdx) {
            if (currentlyLoaded > dragSrcIdx && currentlyLoaded <= targetIdx) currentlyLoaded--;
        } else {
            if (currentlyLoaded >= targetIdx && currentlyLoaded < dragSrcIdx) currentlyLoaded++;
        }
    }

    dragSrcIdx = null;
    render();
}

function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.matchup-item').forEach(el => el.classList.remove('drag-over'));
    dragSrcIdx = null;
}

socket.on('gameUpdate', (state) => {
    const incoming = state.loadedMatchupIndex ?? null;

    // Update Now Playing label if active game changed
    if (incoming !== currentlyLoaded) {
        currentlyLoaded = incoming;
        document.querySelectorAll('.load-btn').forEach(btn => {
            const i = parseInt(btn.dataset.idx);
            const active = i === currentlyLoaded;
            btn.textContent = active ? 'Now Playing' : 'Load';
            btn.classList.toggle('loaded', active);
        });
    }
});

// ── Challonge settings ──
const challongeToggle = document.getElementById('challonge-toggle');
const challongeToggleLabel = document.getElementById('challonge-toggle-label');
const challongeApiKey = document.getElementById('challonge-api-key');
const challongeTourney = document.getElementById('challonge-tourney');
const challongeTourneyList = document.getElementById('challonge-tourney-list');
const challongeListBtn = document.getElementById('challonge-list-btn');
const challongeStatusEl = document.getElementById('challonge-status');

function updateChallongeToggleLabel() {
    challongeToggleLabel.textContent = challongeToggle.checked ? 'Enabled' : 'Disabled';
}

function renderChallongeStatus(status) {
    if (!status) { challongeStatusEl.textContent = ''; return; }
    const state = status.state || 'idle';
    challongeStatusEl.className = 'challonge-status ' + state;
    if (state === 'error') {
        challongeStatusEl.textContent = `Error: ${status.last_error || 'unknown error'}`;
    } else if (status.last_poll_at) {
        challongeStatusEl.textContent = `Last synced: ${status.last_poll_at}`;
    } else {
        challongeStatusEl.textContent = 'Not started';
    }
}

async function loadChallongeStatus() {
    try {
        const res = await fetch('/api/challonge/status');
        if (res.ok) renderChallongeStatus(await res.json());
    } catch (e) {}
}

socket.emit('getChallongeConfig', (cfg) => {
    challongeToggle.checked = !!cfg.enabled;
    challongeApiKey.value = cfg.apiKey || '';
    challongeTourney.value = cfg.tourney || '';
    updateChallongeToggleLabel();
});
loadChallongeStatus();
setInterval(() => { loadChallongeStatus(); loadSchedule(); }, 15000);

challongeToggle.addEventListener('change', () => {
    updateChallongeToggleLabel();
    socket.emit('toggleChallonge', challongeToggle.checked, () => {
        loadChallongeStatus();
        loadSchedule();
    });
});

document.getElementById('challonge-save-btn').addEventListener('click', () => {
    socket.emit('setChallongeConfig', {
        apiKey: challongeApiKey.value,
        tourney: challongeTourney.value,
    }, () => {
        loadChallongeStatus();
        loadSchedule();
    });
});

challongeListBtn.addEventListener('click', () => {
    if (!challongeApiKey.value) {
        challongeStatusEl.className = 'challonge-status error';
        challongeStatusEl.textContent = 'Enter an API key first';
        return;
    }
    challongeListBtn.disabled = true;
    challongeListBtn.textContent = 'Loading…';
    socket.emit('listChallongeTournaments', { apiKey: challongeApiKey.value }, (res) => {
        challongeListBtn.disabled = false;
        challongeListBtn.textContent = 'List Tournaments';
        if (res.error) {
            challongeStatusEl.className = 'challonge-status error';
            challongeStatusEl.textContent = `Error: ${res.error}`;
            return;
        }
        challongeTourneyList.classList.add('visible');
        challongeTourneyList.innerHTML = res.tournaments.map(t => {
            const slug = t.slug || t.id;
            return `
                <div class="challonge-tourney-list-row">
                    <span class="challonge-tourney-list-name">${escHtml(t.name)}
                        <span class="challonge-tourney-list-meta">(${escHtml(t.state)}, ${escHtml(t.tournament_type)})</span>
                    </span>
                    <span class="challonge-tourney-list-slug">${escHtml(slug)}</span>
                </div>
            `;
        }).join('');
    });
});

// ── Podium settings ──
const podiumToggle = document.getElementById('podium-toggle');
const podiumToggleLabel = document.getElementById('podium-toggle-label');
const podiumApiKey = document.getElementById('podium-api-key');
const podiumTournament = document.getElementById('podium-tournament');
const podiumCourt = document.getElementById('podium-court');
const podiumStatusEl = document.getElementById('podium-status');

function updatePodiumToggleLabel() {
    podiumToggleLabel.textContent = podiumToggle.checked ? 'Enabled' : 'Disabled';
}

function renderPodiumStatus(status) {
    if (!status) { podiumStatusEl.textContent = ''; return; }
    const state = status.state || 'off';
    podiumStatusEl.className = 'challonge-status ' + (state === 'error' ? 'error' : (status.connected ? 'idle' : ''));
    if (state === 'error') {
        podiumStatusEl.textContent = `Error: ${status.last_error || 'unknown error'}`;
    } else if (status.connected) {
        podiumStatusEl.textContent = `Live — last event: ${status.last_event_at}`;
    } else {
        podiumStatusEl.textContent = 'Not started';
    }
}

async function loadPodiumStatus() {
    try {
        const res = await fetch('/api/podium/status');
        if (res.ok) renderPodiumStatus(await res.json());
    } catch (e) {}
}

socket.emit('getPodiumConfig', (cfg) => {
    podiumToggle.checked = !!cfg.enabled;
    podiumApiKey.value = cfg.apiKey || '';
    podiumTournament.value = cfg.tournament || '';
    podiumCourt.value = cfg.court || '';
    updatePodiumToggleLabel();
});
loadPodiumStatus();
setInterval(loadPodiumStatus, 15000);

podiumToggle.addEventListener('change', () => {
    updatePodiumToggleLabel();
    socket.emit('togglePodium', podiumToggle.checked, () => {
        loadPodiumStatus();
    });
});

document.getElementById('podium-save-btn').addEventListener('click', () => {
    socket.emit('setPodiumConfig', {
        apiKey: podiumApiKey.value,
        tournament: podiumTournament.value,
        court: podiumCourt.value,
    }, () => {
        loadPodiumStatus();
    });
});

loadSchedule();
</script>
