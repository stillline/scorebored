<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Bracket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 24px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
        }

        .nav-links a:hover { color: #fff; }

        .section-header {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            padding: 6px 0 4px 0;
            margin-top: 16px;
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
        }

        .matchup-list {
            list-style: none;
        }

        .matchup-item {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }

        .matchup-item.drag-over {
            background: #3a3a3a;
            outline: 2px dashed #555;
        }

        .matchup-item.completed {
            background: #1e1e1e;
            opacity: 0.6;
        }

        .matchup-item.completed .team-name-input,
        .matchup-item.completed .score-input {
            color: #777;
            border-color: #333;
            background: #2a2a2a;
        }

        .matchup-item.completed .match-num,
        .matchup-item.completed .match-time,
        .matchup-item.completed .vs-label {
            color: #444;
        }

        .matchup-item.dragging {
            opacity: 0.4;
        }

        .drag-handle {
            cursor: grab;
            color: #555;
            font-size: 18px;
            flex-shrink: 0;
            user-select: none;
            padding: 0 2px;
        }

        .drag-handle:active { cursor: grabbing; }

        .match-num {
            font-size: 12px;
            color: #666;
            min-width: 28px;
            flex-shrink: 0;
        }

        .match-time {
            font-size: 12px;
            color: #888;
            min-width: 40px;
            flex-shrink: 0;
        }

        .team-block {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .team-color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 2px solid #555;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            background: none;
            position: relative;
            overflow: hidden;
        }

        .team-color-swatch input[type="color"] {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .team-name-input {
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            padding: 6px 8px;
            font-size: 14px;
            flex: 1;
            min-width: 0;
        }

        .team-name-input:focus {
            outline: none;
            border-color: #888;
        }

        .vs-label {
            font-size: 11px;
            color: #555;
            font-weight: bold;
            flex-shrink: 0;
        }

        .load-btn {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .load-btn:hover { background: #388e3c; }
        .load-btn:active { background: #1b5e20; }

        .load-btn.loaded {
            background: #1565c0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
            line-height: 1;
            padding: 0 2px;
            transition: color 0.15s;
        }

        .delete-btn:hover { color: #f44336; }

        .update-btn {
            background: none;
            border: 1px solid #555;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
            border-radius: 5px;
            padding: 4px 7px;
            line-height: 1;
            transition: color 0.15s, border-color 0.15s;
        }

        .update-btn:hover { color: #fff; border-color: #aaa; }

        .unplay-btn {
            background: none;
            border: 1px solid #444;
            color: #555;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            border-radius: 5px;
            padding: 4px 7px;
            line-height: 1;
            transition: color 0.15s, border-color 0.15s;
        }

        .unplay-btn:hover { color: #ff9800; border-color: #ff9800; }

        .actions-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .add-btn {
            background: #333;
            color: white;
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            transition: background 0.15s, border-color 0.15s;
        }

        .add-btn:hover {
            background: #3a3a3a;
            border-color: #888;
        }

        .save-btn {
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
        }

        .save-btn:hover { background: #1976d2; }

        .save-status {
            font-size: 13px;
            color: #888;
            align-self: center;
            margin-left: 4px;
        }

        .save-status.ok { color: #4caf50; }
        .save-status.err { color: #f44336; }

        .final-score {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .score-input {
            width: 36px;
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            padding: 5px 4px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .score-input:focus {
            outline: none;
            border-color: #888;
        }

        .score-dash {
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tournament Schedule</h1>
    <div class="nav-links">
        <a href="/control">Control</a>
        <a href="/display" target="_blank">Display</a>
        <a href="/network">Network</a>
        <a href="/teams">Teams &amp; Players</a>
    </div>

    <div id="matchup-list-container"></div>

    <div class="actions-bar">
        <button class="add-btn" id="add-btn">+ Add Matchup</button>
        <button class="save-btn" id="save-btn">Save Schedule</button>
        <span class="save-status" id="save-status"></span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const DEFAULT_LEFT_COLOR  = '#292929';
const DEFAULT_RIGHT_COLOR = '#ebebeb';

let matchups = [];
let currentlyLoaded = null;

// ── Default matchups — Court A, SWQ Tournament ──
const DEFAULT_MATCHUPS = [
    { group: 'Day 1' },
    { num: 1,  time: '9:00',  left: 'Gulls',            right: 'Silky Mitts',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 2,  time: '9:30',  left: 'Copperhead',        right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 3,  time: '10:00', left: 'Mothership',        right: 'Best Bet',         lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 4,  time: '10:30', left: 'Gulls',             right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 5,  time: '11:00', left: 'Silky Mitts',       right: 'Best Bet',         lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 6,  time: '11:30', left: 'Copperhead',        right: 'Valley Boyz',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 7,  time: '12:00', left: 'Gulls',             right: 'Best Bet',         lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 8,  time: '12:30', left: 'A Swig and A Miss', right: 'Valley Boyz',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 9,  time: '13:00', left: 'Silky Mitts',       right: 'Beehive Baes',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 10, time: '13:30', left: 'Gulls',             right: 'Valley Boyz',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 11, time: '14:00', left: 'Best Bet',          right: 'Beehive Baes',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 12, time: '14:30', left: 'A Swig and A Miss', right: 'Nemesis',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 13, time: '15:00', left: 'Gulls',             right: 'Beehive Baes',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 14, time: '15:30', left: 'Valley Boyz',       right: 'Nemesis',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 15, time: '16:00', left: 'Best Bet',          right: 'Yoke',             lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 16, time: '16:30', left: 'Gulls',             right: 'Nemesis',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 17, time: '17:00', left: 'Beehive Baes',      right: 'Yoke',             lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 18, time: '17:30', left: 'Valley Boyz',       right: 'Golden Geese',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 19, time: '18:00', left: 'Gulls',             right: 'Yoke',             lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 20, time: '18:30', left: 'Silky Mitts',       right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { group: 'Day 2' },
    { num: 21, time: '9:00',  left: 'Nemesis',           right: 'Golden Geese',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 22, time: '9:30',  left: 'Beehive Baes',      right: 'Slither',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 23, time: '10:00', left: 'Gulls',             right: 'Golden Geese',     lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 24, time: '10:30', left: 'Yoke',              right: 'Slither',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 25, time: '11:00', left: 'Nemesis',           right: 'Mothership',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 26, time: '11:30', left: 'Gulls',             right: 'Slither',          lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 27, time: '12:00', left: 'Golden Geese',      right: 'Mothership',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 28, time: '12:30', left: 'Yoke',              right: 'Copperhead',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 29, time: '13:00', left: 'Gulls',             right: 'Mothership',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 30, time: '13:30', left: 'Slither',           right: 'Copperhead',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 31, time: '14:00', left: 'Golden Geese',      right: 'Silky Mitts',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 32, time: '14:30', left: 'Gulls',             right: 'Copperhead',       lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 33, time: '15:00', left: 'Copperhead',        right: 'Silky Mitts',      lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
    { num: 34, time: '15:30', left: 'Slither',           right: 'A Swig and A Miss',lc: DEFAULT_LEFT_COLOR, rc: DEFAULT_RIGHT_COLOR },
];

// ── Fetch saved schedule or use defaults ──
async function loadSchedule() {
    try {
        const res = await fetch('/api/bracket');
        if (res.ok) {
            const data = await res.json();
            matchups = data.matchups || DEFAULT_MATCHUPS;
        } else {
            matchups = DEFAULT_MATCHUPS;
        }
    } catch (e) {
        matchups = DEFAULT_MATCHUPS;
    }
    render();
}

// ── Render ──
function render() {
    const container = document.getElementById('matchup-list-container');
    container.innerHTML = '';

    let currentGroup = null;

    matchups.forEach((m, idx) => {
        if (m.group !== undefined) {
            // Section header row
            const header = document.createElement('div');
            header.className = 'section-header';
            header.textContent = m.group;
            container.appendChild(header);
            currentGroup = m.group;
            return;
        }

        const item = document.createElement('div');
        const isCompleted = m.final === true;
        item.className = 'matchup-item' + (isCompleted ? ' completed' : '');
        item.draggable = true;
        item.dataset.idx = idx;

        item.innerHTML = `
            <span class="drag-handle" title="Drag to reorder">⠿</span>
            <span class="match-num">#${m.num || '—'}</span>
            <span class="match-time">${m.time || ''}</span>
            <div class="team-block">
                <button class="team-color-swatch" style="background:${m.lc}" title="Left team color">
                    <input type="color" value="${m.lc}" data-idx="${idx}" data-side="lc">
                </button>
                <input class="team-name-input" type="text" value="${escHtml(m.left)}" data-idx="${idx}" data-field="left" placeholder="Left team">
            </div>
            <span class="vs-label">VS</span>
            <div class="team-block">
                <button class="team-color-swatch" style="background:${m.rc}" title="Right team color">
                    <input type="color" value="${m.rc}" data-idx="${idx}" data-side="rc">
                </button>
                <input class="team-name-input" type="text" value="${escHtml(m.right)}" data-idx="${idx}" data-field="right" placeholder="Right team">
            </div>
            <div class="final-score">
                <input class="score-input" type="number" min="0" value="${m.ls ?? ''}" data-idx="${idx}" data-field="ls" placeholder="—">
                <span class="score-dash">-</span>
                <input class="score-input" type="number" min="0" value="${m.rs ?? ''}" data-idx="${idx}" data-field="rs" placeholder="—">
            </div>
            <button class="unplay-btn" data-idx="${idx}" title="Reset to unplayed" style="${isCompleted ? '' : 'visibility:hidden'}">↺</button>
            <button class="update-btn" data-idx="${idx}" title="Save score without loading">Save</button>
            <button class="load-btn${currentlyLoaded === idx ? ' loaded' : ''}" data-idx="${idx}">
                ${currentlyLoaded === idx ? 'Now Playing' : 'Load'}
            </button>
            <button class="delete-btn" data-idx="${idx}" title="Delete">✕</button>
        `;

        // Color swatch live preview
        item.querySelectorAll('input[type="color"]').forEach(picker => {
            picker.addEventListener('input', e => {
                const i = parseInt(e.target.dataset.idx);
                const side = e.target.dataset.side;
                matchups[i][side] = e.target.value;
                e.target.closest('.team-color-swatch').style.background = e.target.value;
            });
        });

        // Team name edits
        item.querySelectorAll('.team-name-input').forEach(input => {
            input.addEventListener('input', e => {
                const i = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                matchups[i][field] = e.target.value;
            });
        });

        // Final score edits
        item.querySelectorAll('.score-input').forEach(input => {
            input.addEventListener('input', e => {
                const i = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                const val = e.target.value === '' ? null : parseInt(e.target.value);
                matchups[i][field] = isNaN(val) ? null : val;
            });
        });

        // Time edit — inline on the span (double-click to edit)
        const timeSpan = item.querySelector('.match-time');
        timeSpan.style.cursor = 'pointer';
        timeSpan.title = 'Click to edit time';
        timeSpan.addEventListener('click', () => {
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = matchups[idx].time || '';
            inp.style.cssText = 'width:52px;background:#3a3a3a;border:1px solid #666;border-radius:4px;color:white;padding:2px 4px;font-size:12px;';
            timeSpan.replaceWith(inp);
            inp.focus();
            inp.select();
            const commit = () => {
                matchups[idx].time = inp.value;
                inp.replaceWith(timeSpan);
                timeSpan.textContent = inp.value;
            };
            inp.addEventListener('blur', commit);
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
        });

        // Update score button
        item.querySelector('.update-btn').addEventListener('click', async (e) => {
            const m = matchups[idx];
            const btn = e.currentTarget;
            try {
                const res = await fetch('/api/bracket/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idx, ls: m.ls ?? null, rs: m.rs ?? null, final: true }),
                });
                if (res.ok) {
                    btn.textContent = '✓';
                    btn.style.color = '#4caf50';
                    item.classList.toggle('completed', true);
                    item.querySelector('.unplay-btn').style.visibility = '';
                } else {
                    btn.textContent = '✗';
                    btn.style.color = '#f44336';
                }
            } catch {
                btn.textContent = '✗';
                btn.style.color = '#f44336';
            }
            setTimeout(() => { btn.textContent = 'Save'; btn.style.color = ''; }, 1500);
        });

        // Unplay button
        item.querySelector('.unplay-btn').addEventListener('click', async () => {
            matchups[idx].final = false;
            const res = await fetch('/api/bracket/score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idx, ls: matchups[idx].ls, rs: matchups[idx].rs, final: false }),
            });
            if (res.ok) {
                item.classList.remove('completed');
                item.querySelector('.unplay-btn').style.visibility = 'hidden';
            }
        });

        // Load button
        item.querySelector('.load-btn').addEventListener('click', () => loadMatchup(idx));

        // Delete button
        item.querySelector('.delete-btn').addEventListener('click', () => {
            matchups.splice(idx, 1);
            if (currentlyLoaded === idx) currentlyLoaded = null;
            else if (currentlyLoaded > idx) currentlyLoaded--;
            render();
        });

        // Drag-and-drop
        item.addEventListener('dragstart', onDragStart);
        item.addEventListener('dragover', onDragOver);
        item.addEventListener('drop', onDrop);
        item.addEventListener('dragend', onDragEnd);

        container.appendChild(item);
    });
}

function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Load a matchup into the scoreboard ──
async function loadMatchup(idx) {
    const m = matchups[idx];
    if (!m || m.group !== undefined) return;

    // Fetch fresh scores from server in case live-update overwrote in-memory values
    let ls = 0, rs = 0;
    try {
        const res = await fetch('/api/bracket');
        if (res.ok) {
            const data = await res.json();
            const fresh = data.matchups[idx];
            if (fresh && !fresh.group) {
                ls = fresh.ls ?? 0;
                rs = fresh.rs ?? 0;
            }
        }
    } catch (e) {}

    socket.emit('loadMatchup', {
        leftTeam:   m.left,
        rightTeam:  m.right,
        leftColor:  m.lc,
        rightColor: m.rc,
        leftScore:  ls,
        rightScore: rs,
        matchupIndex: idx,
    });

    currentlyLoaded = idx;
    render();
}

// ── Add new blank matchup ──
document.getElementById('add-btn').addEventListener('click', () => {
    matchups.push({
        num: '',
        time: '',
        left: 'Team A',
        right: 'Team B',
        lc: DEFAULT_LEFT_COLOR,
        rc: DEFAULT_RIGHT_COLOR,
    });
    render();
    // Scroll to bottom
    window.scrollTo(0, document.body.scrollHeight);
});

// ── Save schedule ──
document.getElementById('save-btn').addEventListener('click', async () => {
    const status = document.getElementById('save-status');
    status.textContent = 'Saving…';
    status.className = 'save-status';
    try {
        const res = await fetch('/api/bracket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matchups }),
        });
        if (res.ok) {
            status.textContent = 'Saved ✓';
            status.className = 'save-status ok';
        } else {
            throw new Error('Server error');
        }
    } catch (e) {
        status.textContent = 'Save failed';
        status.className = 'save-status err';
    }
    setTimeout(() => { status.textContent = ''; status.className = 'save-status'; }, 3000);
});

// ── Drag-and-drop reorder ──
let dragSrcIdx = null;

function onDragStart(e) {
    dragSrcIdx = parseInt(e.currentTarget.dataset.idx);
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.matchup-item').forEach(el => el.classList.remove('drag-over'));
    e.currentTarget.classList.add('drag-over');
}

function onDrop(e) {
    e.preventDefault();
    const targetIdx = parseInt(e.currentTarget.dataset.idx);
    if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;

    // Reorder only among non-group-header entries
    const [moved] = matchups.splice(dragSrcIdx, 1);
    matchups.splice(targetIdx, 0, moved);

    // Update currentlyLoaded index
    if (currentlyLoaded !== null) {
        if (currentlyLoaded === dragSrcIdx) {
            currentlyLoaded = targetIdx;
        } else if (dragSrcIdx < targetIdx) {
            if (currentlyLoaded > dragSrcIdx && currentlyLoaded <= targetIdx) currentlyLoaded--;
        } else {
            if (currentlyLoaded >= targetIdx && currentlyLoaded < dragSrcIdx) currentlyLoaded++;
        }
    }

    dragSrcIdx = null;
    render();
}

function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.matchup-item').forEach(el => el.classList.remove('drag-over'));
    dragSrcIdx = null;
}

socket.on('bracketUpdated', async () => {
    try {
        const res = await fetch('/api/bracket');
        if (!res.ok) return;
        const data = await res.json();
        const updated = data.matchups || [];
        // Patch scores and final flags into live matchups array and update DOM
        updated.forEach((m, i) => {
            if (!matchups[i] || m.group) return;
            matchups[i].ls = m.ls;
            matchups[i].rs = m.rs;
            matchups[i].final = m.final;
            const item = document.querySelector(`.matchup-item[data-idx="${i}"]`);
            if (!item) return;
            item.classList.toggle('completed', m.final === true);
            const inputs = item.querySelectorAll('.score-input');
            if (inputs[0]) inputs[0].value = m.ls ?? '';
            if (inputs[1]) inputs[1].value = m.rs ?? '';
            const unplayBtn = item.querySelector('.unplay-btn');
            if (unplayBtn) unplayBtn.style.visibility = m.final ? '' : 'hidden';
        });
    } catch (e) {}
});

socket.on('gameUpdate', (state) => {
    const incoming = state.loadedMatchupIndex ?? null;

    // Update Now Playing label if active game changed
    if (incoming !== currentlyLoaded) {
        currentlyLoaded = incoming;
        document.querySelectorAll('.load-btn').forEach(btn => {
            const i = parseInt(btn.dataset.idx);
            const active = i === currentlyLoaded;
            btn.textContent = active ? 'Now Playing' : 'Load';
            btn.classList.toggle('loaded', active);
        });
    }

    // Live-update score inputs for the currently playing matchup (not finalized)
    if (incoming !== null && matchups[incoming] && !matchups[incoming].final) {
        matchups[incoming].ls = state.leftScore;
        matchups[incoming].rs = state.rightScore;
        const item = document.querySelector(`.matchup-item[data-idx="${incoming}"]`);
        if (item) {
            const inputs = item.querySelectorAll('.score-input');
            if (inputs[0]) inputs[0].value = state.leftScore ?? '';
            if (inputs[1]) inputs[1].value = state.rightScore ?? '';
        }
    }
});

loadSchedule();
</script>
</body>
</html>
