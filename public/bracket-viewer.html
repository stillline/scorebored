<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 24px;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
        }

        .nav-links a:hover { color: #fff; }

        .meta {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 60px 20px;
            font-size: 15px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin: 24px 0 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }

        /* Standings table */
        table.standings {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
        }

        table.standings th, table.standings td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
        }

        table.standings th {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        table.standings td.num { text-align: center; }

        /* Bracket tree */
        .bracket-tree {
            display: flex;
            gap: 1.5%;
            padding: 10px 0 20px;
            width: 100%;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 16px;
            flex: 1 1 0;
            min-width: 0;
        }

        .bracket-round-label {
            text-align: center;
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bracket-match {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            min-width: 0;
        }

        .bracket-match .row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            padding: 3px 0;
            color: #ccc;
            min-width: 0;
        }

        .bracket-match .row span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .bracket-match .row.winner {
            color: #fff;
            font-weight: bold;
        }

        .bracket-match .score {
            color: #888;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Bracket Viewer</h1>
    <div class="nav-links">
        <a href="/control">Control</a>
        <a href="/bracket">Schedule</a>
        <a href="/display" target="_blank">Display</a>
        <a href="/network">Network</a>
        <a href="/teams">Teams</a>
        <a href="/bracket-viewer">Bracket Viewer</a>
        <a href="http://10.42.0.1:8000/" target="_blank">Companion</a>
    </div>
    <div class="meta" id="meta"></div>
    <div id="content"><div class="empty-state">Loading…</div></div>
</div>

<script>
function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildStandings(matches) {
    const records = {};
    const bump = (name) => { if (!records[name]) records[name] = { name, wins: 0, losses: 0, ties: 0 }; return records[name]; };

    matches.forEach(m => {
        if (m.state !== 'complete') return;
        if (m.player1 === 'TBD' || m.player2 === 'TBD') return;
        const p1 = bump(m.player1);
        const p2 = bump(m.player2);
        if (m.tie) {
            p1.ties++; p2.ties++;
        } else if (m.winner_id && m.winner_id === m.player1_id) {
            p1.wins++; p2.losses++;
        } else if (m.winner_id && m.winner_id === m.player2_id) {
            p2.wins++; p1.losses++;
        }
    });

    return Object.values(records).sort((a, b) => (b.wins - b.losses) - (a.wins - a.losses));
}

function renderStandings(matches) {
    const standings = buildStandings(matches);
    if (standings.length === 0) {
        return '<div class="empty-state">No completed matches yet — standings will appear here once group play begins.</div>';
    }
    const rows = standings.map(s => `
        <tr>
            <td>${escHtml(s.name)}</td>
            <td class="num">${s.wins}</td>
            <td class="num">${s.losses}</td>
            <td class="num">${s.ties}</td>
        </tr>
    `).join('');
    return `
        <div class="section-title">Standings</div>
        <table class="standings">
            <thead><tr><th>Team</th><th class="num">W</th><th class="num">L</th><th class="num">T</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function renderBracketSide(matches, title) {
    const byRound = {};
    matches.forEach(m => {
        if (!byRound[m.round]) byRound[m.round] = [];
        byRound[m.round].push(m);
    });
    const roundKeys = Object.keys(byRound).map(Number).sort((a, b) => Math.abs(a) - Math.abs(b));

    const rounds = roundKeys.map(r => {
        const roundMatches = byRound[r].sort((a, b) => (a.suggested_play_order || 0) - (b.suggested_play_order || 0));
        const matchesHtml = roundMatches.map(m => {
            const p1Winner = m.winner_id && m.winner_id === m.player1_id;
            const p2Winner = m.winner_id && m.winner_id === m.player2_id;
            const scores = (m.scores || '').split(' - ');
            return `
                <div class="bracket-match">
                    <div class="row${p1Winner ? ' winner' : ''}">
                        <span>${escHtml(m.player1)}</span>
                        <span class="score">${m.state === 'complete' ? (scores[0] || '') : ''}</span>
                    </div>
                    <div class="row${p2Winner ? ' winner' : ''}">
                        <span>${escHtml(m.player2)}</span>
                        <span class="score">${m.state === 'complete' ? (scores[1] || '') : ''}</span>
                    </div>
                </div>
            `;
        }).join('');
        return `
            <div class="bracket-round">
                <div class="bracket-round-label">Round ${r}</div>
                ${matchesHtml}
            </div>
        `;
    }).join('');

    return `
        <div class="section-title">${title}</div>
        <div class="bracket-tree">${rounds}</div>
    `;
}

function render(data) {
    const meta = document.getElementById('meta');
    meta.textContent = data.updated_at ? `Last synced: ${data.updated_at}` : '';

    const content = document.getElementById('content');
    const matches = data.matches || [];

    if (matches.length === 0) {
        content.innerHTML = '<div class="empty-state">No bracket data yet — enable Challonge sync from the Schedule page.</div>';
        return;
    }

    // Challonge represents winners-bracket rounds as positive numbers and,
    // for double elimination, losers-bracket rounds as negative numbers.
    // Individual matches don't carry a stage marker, so the tournament-level
    // state is the only reliable "still in groups" signal Challonge exposes.
    const stillInGroupStage = data.tournament_state === 'group_stages_underway';

    let html = '';
    if (stillInGroupStage) {
        html += renderStandings(matches);
    } else {
        const winners = matches.filter(m => m.round > 0);
        const losers = matches.filter(m => m.round < 0);
        if (winners.length > 0) html += renderBracketSide(winners, 'Winners Bracket');
        if (losers.length > 0) html += renderBracketSide(losers, 'Losers Bracket');
        if (winners.length === 0 && losers.length === 0) {
            html += '<div class="empty-state">Elimination bracket not seeded yet.</div>';
        }
    }
    content.innerHTML = html;
}

async function load() {
    try {
        const res = await fetch('/api/sync/challonge/bracket');
        if (!res.ok) {
            document.getElementById('content').innerHTML = '<div class="empty-state">No bracket data yet — enable Challonge sync from the Schedule page.</div>';
            return;
        }
        render(await res.json());
    } catch (e) {
        document.getElementById('content').innerHTML = '<div class="empty-state">Failed to load bracket data.</div>';
    }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
