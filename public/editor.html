<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorebug Editor</title>
<style>
:root{
  --bg:#15171c; --panel:#1e2129; --panel-2:#262a33; --border:#343946;
  --text:#e8eaed; --dim:#9aa0ac; --accent:#4f8cff;
  --face:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--face);display:flex;flex-direction:column}

/* ---- top bar: preset list / save / new / delete ---- */
#topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--border)}
#topbar select, #topbar input[type=text]{
  background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:6px 10px;font-size:14px}
#topbar button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:6px 12px;font-size:14px;cursor:pointer}
#topbar button:hover{background:var(--border)}
#topbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#topbar .spacer{flex:1}
#saveStatus{font-size:12px;color:var(--dim)}
#activeStatus{font-size:12px;color:var(--dim);font-weight:700;margin-right:10px}

/* ---- main layout: palette | canvas | properties ---- */
#main{flex:1;display:flex;overflow:hidden}

#palette{width:200px;background:var(--panel);border-right:1px solid var(--border);
  padding:12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
#palette h3{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--dim);margin:8px 0 2px}
#palette button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:8px 10px;font-size:13px;text-align:left;cursor:pointer}
#palette button:hover{background:var(--border)}
#palette input[type=file]{display:none}

#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;
  overflow:auto;background:#0a0b0d;position:relative}
#canvasSizer{flex-shrink:0}
#polygonHint{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:8px 14px;font-size:13px;color:var(--text);z-index:20000;pointer-events:none}
#canvas{position:relative;width:1920px;height:1080px;background:#000;
  transform-origin:top left;outline:1px solid #333}
#canvas.drawingPolygon{cursor:crosshair}
#canvas.drawingPolygon .el{pointer-events:none}
#canvas.spacePan{cursor:grab}
#canvas.spacePan .el{pointer-events:none}
#canvas.spacePanning{cursor:grabbing}
#canvas.showGrid{
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.12) 1px, transparent 1px);
  background-size:50px 50px;
}

.guide{position:absolute;background:#ff4fd8;pointer-events:none;z-index:9999}
.guide.v{width:1px;top:0;bottom:0}
.guide.h{height:1px;left:0;right:0}
/* The canvas's own horizontal/vertical centerline, as opposed to a guide
   aligning against another element - called out in red since "centered on
   the broadcast frame" matters more than "lines up with something else". */
.guide.center{background:#ff3b3b}

#marquee{position:absolute;border:1px solid var(--accent);
  background:rgba(79,140,255,0.15);pointer-events:none;z-index:9998}

.el{position:absolute;cursor:move;outline:1px dashed transparent}
.el:hover{outline-color:rgba(79,140,255,0.5)}
.el.selected{outline:2px solid var(--accent)}
.el img{width:100%;height:100%;object-fit:contain;pointer-events:none}
/* Editor-only luma-key preview: uploaded logos are already flattened to
   true black wherever they're meant to key out (see POST /api/logos on
   the server). screen-blending against whatever is painted below (the
   black canvas, or any other element - text, another image - positioned
   underneath) is a mathematical no-op for black pixels (they read as
   transparent, correctly revealing what's behind them) and a no-op for
   everything else (non-black pixels pass through unchanged) - so this is
   an accurate preview of the real luma key, not a fake. Lives ONLY here,
   never in scorebug-render.js: the real broadcast display must keep
   rendering images normally and let the ATEM's own hardware keyer do the
   actual compositing - applying this on the live output would be
   redundant at best. Selection still reads via the .selected outline,
   independent of how transparent the image content itself looks.

   Deliberately NOT isolated: an isolated stacking context would make an
   image blend only against its own empty backdrop instead of against
   whatever's actually stacked underneath it (scorebug text, another
   element) - which defeats the purpose here, since the common case is a
   logo placed OVER other content that should show through its black
   regions. The tradeoff is that two images directly overlapping each
   other can blend in a less predictable way against each other - a much
   rarer case than "logo over scorebug", and worth accepting. */
.el-luma-preview img{mix-blend-mode:screen}
.resize-handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;
  background:var(--accent);border-radius:2px;cursor:nwse-resize}
.vertex-handle{position:absolute;width:10px;height:10px;margin:-5px;
  background:#fff;border:2px solid var(--accent);border-radius:50%;cursor:move;z-index:10000}
#polygonDraftDot{position:absolute;width:8px;height:8px;margin:-4px;
  background:var(--accent);border-radius:50%;pointer-events:none;z-index:10000}

#props{width:280px;background:var(--panel);border-left:1px solid var(--border);
  padding:14px;overflow-y:auto}
#props h3{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--dim);margin:14px 0 6px}
#props h3:first-child{margin-top:0}
#props .row{display:flex;gap:8px;margin-bottom:8px}
#props .row > div{flex:1}
#props label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
#props input[type=number], #props input[type=text], #props select{
  width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:5px 7px;font-size:13px}
#props input[type=color]{width:100%;height:28px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:4px;padding:2px;cursor:pointer}
#props input[type=range]{width:100%}
#props button.danger{width:100%;margin-top:14px;background:#3a2222;border:1px solid #5a3333;
  color:#ff8080;border-radius:4px;padding:8px;cursor:pointer;font-size:13px}
#props button.danger:hover{background:#4a2828}
#props button.step{background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
#props button.step:hover{background:var(--border)}
#emptyProps{color:var(--dim);font-size:13px;padding:8px 0}
</style>
</head>
<body>

<div id="topbar">
  <select id="presetSelect"><option value="">New preset...</option></select>
  <select id="versionSelect" title="Version history for this preset"></select>
  <input type="text" id="presetName" placeholder="(auto-named if left blank)">
  <button id="btnNew">New</button>
  <button id="btnSave" class="primary">Save (new version)</button>
  <button id="btnDelete">Delete Preset</button>
  <button id="btnSetActive">Set Active (Live)</button>
  <button id="btnToggleGrid">Grid: Off</button>
  <button id="btnZoomOut" title="Zoom out">－</button>
  <span id="zoomLabel" style="min-width:42px;text-align:center;font-size:13px">100%</span>
  <button id="btnZoomIn" title="Zoom in">＋</button>
  <button id="btnZoomReset" title="Reset zoom to fit the window">Fit</button>
  <div class="spacer"></div>
  <span id="activeStatus"></span>
  <span id="saveStatus"></span>
</div>

<div id="main">
  <div id="palette">
    <h3>Data Elements</h3>
    <button data-role="teamName" data-side="left">Team Name (Left)</button>
    <button data-role="teamName" data-side="right">Team Name (Right)</button>
    <button data-role="score" data-side="left">Score (Left)</button>
    <button data-role="score" data-side="right">Score (Right)</button>
    <button data-role="clock" data-side="">Clock</button>
    <button data-role="timeouts" data-side="">Timeouts (combined)</button>
    <button data-role="penalties" data-side="">Penalties (combined)</button>
    <button data-role="timeoutCount" data-side="left">Timeout Count (Left)</button>
    <button data-role="timeoutCount" data-side="right">Timeout Count (Right)</button>
    <button data-role="penaltyCount" data-side="left">Penalty Count (Left)</button>
    <button data-role="penaltyCount" data-side="right">Penalty Count (Right)</button>
    <button data-role="feed" data-side="">Event Feed</button>
    <h3>Static</h3>
    <button data-role="label" data-side="">Text Label</button>
    <h3>Shapes</h3>
    <button id="btnAddShape">Rectangle</button>
    <button id="btnDrawPolygon">Draw Polygon...</button>
    <h3>Images</h3>
    <button id="btnAddLogo">Add Logo...</button>
    <input type="file" id="logoFile" accept="image/png">
  </div>

  <div id="canvasWrap">
    <div id="canvasSizer">
      <div id="canvas"></div>
    </div>
    <div id="polygonHint" style="display:none">Click to place points · Double-click or Enter to finish · Esc to cancel</div>
  </div>

  <div id="props">
    <div id="emptyProps">Select an element to edit its properties, or add one from the palette.</div>
    <div id="propsForm" style="display:none">
      <div id="selectionCount" style="display:none;font-size:12px;color:var(--dim);margin-bottom:10px"></div>
      <div id="positionSizeProps">
        <h3>Position &amp; Size</h3>
        <div class="row">
          <div><label>X</label><input type="number" id="pX"></div>
          <div><label>Y</label><input type="number" id="pY"></div>
        </div>
        <div class="row">
          <div><label>Width</label><input type="number" id="pW"></div>
          <div><label>Height</label><input type="number" id="pH"></div>
        </div>
      </div>
      <div class="row">
        <div><label>Z-index</label><input type="number" id="pZ"></div>
        <div><label>Opacity</label><input type="range" id="pOpacity" min="0" max="1" step="0.05"></div>
      </div>

      <div id="textProps">
        <div id="pLabelTextRow" class="row" style="display:none">
          <div><label>Label Text</label><input type="text" id="pLabelText" placeholder="Label"></div>
        </div>
        <h3>Text Style</h3>
        <div class="row">
          <div><label>Font size (px)</label><input type="number" id="pFontSize"></div>
          <div id="pFontSizeStepRow" style="display:none;flex:0 0 auto;align-self:flex-end;gap:4px">
            <button type="button" class="step" id="pFontSizeStepDown" title="Shrink every selected element's own font size">－</button>
            <button type="button" class="step" id="pFontSizeStepUp" title="Grow every selected element's own font size">＋</button>
          </div>
        </div>
        <div class="row">
          <div><label>Weight</label>
            <select id="pFontWeight">
              <option value="400">Normal</option>
              <option value="700">Bold</option>
              <option value="900">Black</option>
            </select>
          </div>
          <div><label>Align</label>
            <select id="pAlign">
              <option value="left">Left</option>
              <option value="center">Center</option>
              <option value="right">Right</option>
            </select>
          </div>
        </div>
        <div class="row" id="pColorRow"><div><label>Color</label><input type="color" id="pColor"></div></div>
        <div class="row">
          <div><label>Background</label><input type="color" id="pFillColor">
            <label style="display:flex;align-items:center;gap:5px;margin-top:4px;font-weight:normal">
              <input type="checkbox" id="pFillNone" style="width:auto">None
            </label>
          </div>
          <div><label>Uppercase</label>
            <select id="pUppercase">
              <option value="none">No</option>
              <option value="uppercase">Yes</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div><label><input type="checkbox" id="pAutoSize" style="width:auto;margin-right:6px">Auto-size to text</label></div>
        </div>
      </div>

      <div id="feedColorProps" style="display:none">
        <h3>Feed Colors</h3>
        <!-- One row per FEED_COLOR_TYPES entry, built in renderFeedColorProps()
             so this list can't drift out of sync with scorebug-render.js. -->
      </div>

      <div id="shapeProps" style="display:none">
        <div id="pCornerRadiusRow" class="row">
          <div><label>Corner Radius</label><input type="number" id="pCornerRadius" min="0"></div>
        </div>
        <h3>Fill</h3>
        <div class="row">
          <div><label><input type="checkbox" id="pGradientEnabled" style="width:auto;margin-right:6px">Use Gradient</label></div>
        </div>
        <div class="row" id="pFillSolidRow">
          <div><label>Color</label><input type="color" id="pShapeFillColor"></div>
        </div>
        <div id="pGradientProps" style="display:none">
          <div class="row">
            <div><label>Angle</label><input type="number" id="pGradientAngle" min="0" max="360"></div>
          </div>
          <div class="row">
            <div><label>Start Color</label><input type="color" id="pGradientStart"></div>
            <div><label>End Color</label><input type="color" id="pGradientEnd"></div>
          </div>
        </div>
        <h3>Border</h3>
        <div class="row">
          <div><label>Width</label><input type="number" id="pBorderWidth" min="0"></div>
          <div><label>Color</label><input type="color" id="pBorderColor"></div>
        </div>
        <h3>Drop Shadow</h3>
        <div class="row">
          <div><label><input type="checkbox" id="pShadowEnabled" style="width:auto;margin-right:6px">Enabled</label></div>
        </div>
        <div id="pShadowDetailProps" style="display:none">
          <div class="row">
            <div><label>Offset X</label><input type="number" id="pShadowX"></div>
            <div><label>Offset Y</label><input type="number" id="pShadowY"></div>
          </div>
          <div class="row">
            <div><label>Blur</label><input type="number" id="pShadowBlur" min="0"></div>
            <div><label>Opacity</label><input type="range" id="pShadowOpacity" min="0" max="1" step="0.05"></div>
          </div>
          <div class="row">
            <div><label>Color</label><input type="color" id="pShadowColor"></div>
          </div>
        </div>
      </div>

      <div class="row">
        <div><button type="button" id="btnBringToFront">Bring to Front</button></div>
        <div><button type="button" id="btnSendToBack">Send to Back</button></div>
      </div>

      <div class="row">
        <div><button type="button" id="btnDuplicate">Duplicate</button></div>
      </div>

      <button class="danger" id="btnDeleteEl">Delete Element</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/scorebug-render.js"></script>
<script>
"use strict";

// Static mock gameState, used as the preview source whenever there's no
// live connection yet (or no game in progress) - so the editor is still
// usable for layout work without a live game running on court.
const MOCK_GAME_STATE = {
  leftTeam: "Team A", rightTeam: "Team 2",
  leftScore: 4, rightScore: 3,
  timeouts: { left: 1, right: 2 },
  penalties: { left: [{ player: "J. Smith", remaining_seconds: 34 }], right: [] },
  feed: [
    { id: 1, type: "game_start", leftTeam: "Team A", rightTeam: "Team 2" },
    { id: 2, type: "goal", side: "left", player: "J. Smith" },
    { id: 3, type: "goal", side: "right", player: null },
    { id: 4, type: "timeout", side: "right" },
    { id: 5, type: "penalty_minor", side: "left", player: "J. Smith" },
    { id: 6, type: "penalty_major", side: "right", player: "A. Lee" },
    { id: 7, type: "turnover", side: "left", player: "K. Park" },
    { id: 8, type: "ejection", side: "right", player: "A. Lee" },
  ],
  _currentClock: { running: true, phase: "regulation", remaining_seconds: 452, localAnchorAt: Date.now() },
};

// Live gameState, kept in sync over the editor's own socket connection.
// Preferred over MOCK_GAME_STATE for the canvas preview once it arrives,
// so what you see while editing matches what's actually about to go out
// on the real display when you hit "Set Active".
const socket = io();
let liveGameState = null;

socket.on('gameUpdate', (gameState) => {
  gameState._currentClock = gameState.clock ? { ...gameState.clock, localAnchorAt: Date.now() } : null;
  liveGameState = gameState;
  updateActiveStatus();
  redrawCanvas();
});

socket.on('connect', () => updateActiveStatus());
socket.on('disconnect', () => updateActiveStatus());

function previewGameState(){
  return liveGameState || MOCK_GAME_STATE;
}

const canvas = document.getElementById("canvas");

// presetMeta: {id, name, versions: [{version, createdAt}], activeVersion}
// for the currently-loaded preset, or null for an unsaved/new one.
// `preset` below is just the CONTENT on the canvas right now (canvas +
// elements) - it may be a brand new unsaved draft, or a specific
// historical version loaded for viewing/editing-from. Saving always
// creates a new version; it never overwrites one, and never changes
// what's live on its own (see btnSave / btnSetActive below).
let presetMeta = null;
let viewingVersion = null; // version number currently on canvas, or null if unsaved

// The selection: a Set of element ids, 0+ members. Most of the existing
// single-select code reads currentElement()/selectedId (the Set's one
// member when size===1, or null otherwise) and keeps working unchanged;
// only multi-select-aware code (marquee, shift-click, group drag, bulk
// props) needs to look at selectedIds directly.
let selectedIds = new Set();
let nextElSeq = 1;

function blankPreset(){
  return { canvas: { width: 1920, height: 1080 }, elements: [] };
}
let preset = blankPreset();

// ---- dirty tracking (for the reload/close confirmation) ----
//
// lastSavedSnapshot is the preset JSON as of the last successful load or
// save - isDirty() compares the live preset against it on demand rather
// than maintaining a separate boolean that every single mutation site
// would need to remember to set (easy to miss one, same risk undo's
// whole-snapshot approach was chosen to avoid - see commitHistory above).
// Declared AFTER `preset` itself - `let` bindings are in the temporal dead
// zone until their own declaration runs, so reading `preset` here any
// earlier throws a ReferenceError that aborts this entire script (nothing
// after it - including every addEventListener below - ever registers,
// which looked like "every button in the editor silently stopped working").
let lastSavedSnapshot = JSON.stringify(preset);

function markSnapshotClean(){
  lastSavedSnapshot = JSON.stringify(preset);
}

function isDirty(){
  return JSON.stringify(preset) !== lastSavedSnapshot;
}

window.addEventListener("beforeunload", (e) => {
  if(!isDirty()) return;
  // Browsers ignore any custom string here and show their own generic
  // wording - setting returnValue is what actually triggers the prompt at
  // all (both are required for cross-browser support).
  e.preventDefault();
  e.returnValue = "";
});

// ---- undo/redo ----
//
// A stack of whole-preset snapshots rather than per-field diffs - this
// editor's mutations are too varied (drag, resize, vertex drag, every prop
// field, restack, add, delete) to diff cleanly, and a preset is small
// enough (a few KB of JSON) that cloning it wholesale on every committed
// action is simple and correct, if not maximally efficient. Only commitHistory()
// pushes - mid-drag/mid-slider updates call redrawCanvas() directly without
// touching this stack, so one undo always steps back a whole completed
// action (a full drag, not one mousemove tick), never a half-finished one.
const UNDO_LIMIT = 100;
let undoStack = [];
let redoStack = [];

function snapshotState(){
  return { preset: JSON.parse(JSON.stringify(preset)), selectedIds: new Set(selectedIds) };
}

// Called BEFORE a mutation, with the state as it was just before that
// mutation starts - so undo restores "how things were right before this
// action", and the action's own result becomes redo-able.
function commitHistory(){
  undoStack.push(snapshotState());
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
}

function restoreSnapshot(snapshot){
  preset = JSON.parse(JSON.stringify(snapshot.preset));
  selectedIds = new Set(snapshot.selectedIds);
  resyncElIdCounter();
  redrawCanvas();
  renderPropsPanel();
}

function undo(){
  if(undoStack.length === 0) return;
  redoStack.push(snapshotState());
  restoreSnapshot(undoStack.pop());
}

function redo(){
  if(redoStack.length === 0) return;
  undoStack.push(snapshotState());
  restoreSnapshot(redoStack.pop());
}

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey; // metaKey: Cmd on Mac, ctrlKey: Ctrl elsewhere
  if(!mod || e.key.toLowerCase() !== "z") return;
  // Target check: never hijack Z while the user is actually typing in a
  // text field (preset name, label text) - browsers already give inputs
  // their own native undo for text content, and stealing the shortcut
  // there would undo canvas state instead of the character just typed.
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  e.preventDefault();
  if(e.shiftKey) redo(); else undo();
});

// Keeps freshly-added elements' ids clear of every id used anywhere in the
// loaded preset's FULL history (not just the version on canvas right now)
// - otherwise switching versions and adding something new can mint an id
// that collides with one already present in a different saved version.
// fullPresetDoc is the raw server response (all versions), kept around
// just for this scan - see loadPreset().
let fullPresetDoc = null;

function resyncElIdCounter(){
  let highest = 0;
  const scan = (elements) => (elements || []).forEach(el => {
    const m = /^el_(\d+)$/.exec(el.id || "");
    if(m) highest = Math.max(highest, parseInt(m[1], 10));
  });
  scan(preset.elements);
  if(fullPresetDoc) fullPresetDoc.versions.forEach(v => scan(v.elements));
  nextElSeq = highest + 1;
}

function genElId(){ return "el_" + (nextElSeq++); }

// A fresh shape/polygon defaults to sitting BEHIND everything already on
// the canvas - it's almost always added as a background/highlight box for
// existing text or images, so starting it in front (the plain "next z"
// every other element type uses) would bury whatever it's meant to sit
// behind the moment it's created. Text/data/image elements keep the old
// "add to front" default, since those are usually the new focal content.
function zBehindEverything(){
  const lowest = preset.elements.reduce((min, el) => Math.min(min, el.z ?? 0), 0);
  return lowest - 1;
}

/* ---- fit canvas to the available viewport, preserving true 1920x1080 coordinate space ---- */
//
// userZoom is a multiplier on top of the auto-fit-to-window scale (1.0 =
// "Fit", the old fixed behavior) - everything downstream (drag math, snap
// guides, marquee selection, resize) already reads the live scale back out
// of canvas.style.transform via canvasScale() rather than tracking it
// separately, so zooming in/out needs no changes anywhere else: the
// coordinate math is scale-agnostic by construction.
let userZoom = 1;
const ZOOM_STEP = 0.25;
const ZOOM_MIN = 0.25;
const ZOOM_MAX = 4;

function fitScale(){
  const wrap = document.getElementById("canvasWrap");
  return Math.min((wrap.clientWidth - 40) / 1920, (wrap.clientHeight - 40) / 1080, 1);
}

function fitCanvas(){
  const sizer = document.getElementById("canvasSizer");
  const scale = fitScale() * userZoom;
  canvas.style.transform = "scale(" + scale + ")";
  sizer.style.width = (1920 * scale) + "px";
  sizer.style.height = (1080 * scale) + "px";
  document.getElementById("zoomLabel").textContent = Math.round(userZoom * 100) + "%";
}
window.addEventListener("resize", fitCanvas);

function setZoom(zoom){
  userZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom));
  fitCanvas();
}
document.getElementById("btnZoomOut").addEventListener("click", () => setZoom(userZoom - ZOOM_STEP));
document.getElementById("btnZoomIn").addEventListener("click", () => setZoom(userZoom + ZOOM_STEP));
document.getElementById("btnZoomReset").addEventListener("click", () => setZoom(1));

// ---- spacebar-drag pan (Figma/Photoshop convention) ----
//
// Needed once userZoom pushes the canvas past canvasWrap's viewport -
// #canvasWrap already scrolls natively (overflow:auto), so this is really
// just "drag to set scrollLeft/scrollTop" rather than a custom viewport;
// holding Space swaps the canvas into a grab-cursor panning mode so a drag
// there moves the viewport instead of moving/marquee-selecting whatever's
// under the cursor.
const canvasWrapEl = document.getElementById("canvasWrap");
let spaceHeld = false;

document.addEventListener("keydown", e => {
  if(e.code !== "Space" || spaceHeld) return;
  // Don't hijack Space while typing in a text field (preset name, label
  // text, any number input) - it should type a literal space there, not
  // arm panning.
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  e.preventDefault();
  spaceHeld = true;
  canvas.classList.add("spacePan");
});
document.addEventListener("keyup", e => {
  if(e.code !== "Space") return;
  spaceHeld = false;
  canvas.classList.remove("spacePan");
});
// Safety reset: alt-tabbing away (or anything else that steals focus) while
// Space is held never fires a keyup on this page, which would otherwise
// leave panning mode stuck on indefinitely.
window.addEventListener("blur", () => {
  spaceHeld = false;
  canvas.classList.remove("spacePan", "spacePanning");
});

canvasWrapEl.addEventListener("mousedown", e => {
  if(!spaceHeld) return;
  e.preventDefault();
  e.stopPropagation(); // never also start a marquee/element drag underneath
  const startX = e.clientX, startY = e.clientY;
  const startScrollLeft = canvasWrapEl.scrollLeft, startScrollTop = canvasWrapEl.scrollTop;
  canvas.classList.add("spacePanning");
  function onMove(me){
    canvasWrapEl.scrollLeft = startScrollLeft - (me.clientX - startX);
    canvasWrapEl.scrollTop = startScrollTop - (me.clientY - startY);
  }
  function onUp(){
    canvas.classList.remove("spacePanning");
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}, true);

/* ---- rendering: canvas is just scorebug-render.js's renderElement, plus editor chrome ---- */
function redrawCanvas(){
  const gameState = previewGameState();
  while(canvas.firstChild) canvas.removeChild(canvas.firstChild);
  preset.elements.forEach(element => {
    const isDataText = element.type !== "image" && element.type !== "shape" && element.type !== "polygon";
    const value = isDataText ? resolveBinding(element.role, element.side, gameState, element) : null;
    // renderElement mutates element.x/y/w/h in place when text.autoSize is
    // on (see scorebug-render.js), so the box dragged/resized here is
    // always the real one actually being saved - never a stale copy.
    const node = renderElement(element, value);
    node.dataset.role = element.role || "";
    node.classList.add("el");
    if(element.type === "image") node.classList.add("el-luma-preview");
    if(selectedIds.has(element.id)) node.classList.add("selected");
    node.addEventListener("mousedown", e => startDrag(e, element));
    // Resize only makes sense with exactly one element selected - resizing
    // a multi-selection would need a defined anchor/scaling behavior this
    // editor doesn't have, so the handle only appears for a lone selection.
    // Polygons resize by dragging their individual vertex handles instead
    // (see renderPolygonHandles) - a bounding-box resize would stretch the
    // SVG's viewBox without the editor having any defined rule for what
    // "stretch this freeform shape" should do to each point.
    if(!isAutoSizedElement(element) && element.type !== "polygon" && selectedIds.size <= 1){
      const handle = document.createElement("div");
      handle.className = "resize-handle";
      handle.addEventListener("mousedown", e => { e.stopPropagation(); startResize(e, element); });
      node.appendChild(handle);
    }
    canvas.appendChild(node);
    if(element.type === "polygon" && selectedIds.has(element.id) && selectedIds.size === 1){
      renderPolygonHandles(element);
    }
  });
  if(selectedIds.size === 1) refreshSizeFields();
}

// After a redraw, an auto-sized element's w/h/x/y may have just been
// recomputed from its text - keep the Position & Size fields showing the
// box that's actually on screen rather than going stale until next select.
// Only meaningful for a single selection (see renderPropsPanel/bulk mode).
function refreshSizeFields(){
  const el = currentElement();
  if(!el) return;
  document.getElementById("pX").value = el.x;
  document.getElementById("pY").value = el.y;
  document.getElementById("pW").value = el.w;
  document.getElementById("pH").value = el.h;
}

/* live clock preview ticks like the real display does, without a full
   rebuild (avoids flicker on image elements / re-triggering drag state) */
setInterval(() => {
  if(preset.elements.some(e => e.role === "clock")) tickClockElements(previewGameState(), canvas);
}, 1000);

/* ---- selection + property panel ---- */
// id: a single id, an array/Set of ids, or null/undefined to clear.
function selectElement(id){
  if(id == null) selectedIds = new Set();
  else if(id instanceof Set) selectedIds = id;
  else if(Array.isArray(id)) selectedIds = new Set(id);
  else selectedIds = new Set([id]);
  redrawCanvas();
  renderPropsPanel();
}

function toggleElementSelection(id){
  const next = new Set(selectedIds);
  if(next.has(id)) next.delete(id); else next.add(id);
  selectElement(next);
}

// The one selected element, or null when zero or multiple are selected -
// every single-select-only code path (drag of one element, resize, the
// non-bulk props panel) goes through this rather than selectedIds directly.
function currentElement(){
  if(selectedIds.size !== 1) return null;
  const id = selectedIds.values().next().value;
  return preset.elements.find(e => e.id === id) || null;
}

function selectedElements(){
  return preset.elements.filter(e => selectedIds.has(e.id));
}

// A control shared across a bulk selection shows the first element's value
// when every selected element agrees, or is left blank/unchecked (a
// "mixed" state, same convention as Keynote/Figma) when they don't - typing
// into it still applies to all of them (see bindPropInput's bulkable mode),
// it's purely about what the field displays going in.
function commonValue(elements, getter){
  const first = getter(elements[0]);
  return elements.every(el => getter(el) === first) ? first : null;
}

function renderPropsPanel(){
  const selected = selectedElements();
  const empty = document.getElementById("emptyProps");
  const form = document.getElementById("propsForm");
  if(selected.length === 0){
    empty.style.display = "block";
    form.style.display = "none";
    return;
  }
  empty.style.display = "none";
  form.style.display = "block";

  const bulk = selected.length > 1;
  const countEl = document.getElementById("selectionCount");
  countEl.style.display = bulk ? "block" : "none";
  countEl.textContent = bulk ? selected.length + " elements selected" : "";

  // Position & Size (X/Y/W/H) is single-element-only - there's no sensible
  // shared value for "position" the way there is for "font size", and the
  // resize handle itself only appears with one element selected (see
  // redrawCanvas) - group moves go through canvas drag instead (startDrag).
  // A polygon's x/y/w/h are derived from its points (see buildPolygonNode)
  // rather than independently settable, so the fields are also hidden -
  // never disabled-but-visible, since a number that silently does nothing
  // when typed into is worse than no field at all - for that one type even
  // alone.
  const isPolygon = el => el.type === "polygon";
  const showPositionSize = !bulk && !isPolygon(selected[0]);
  document.getElementById("positionSizeProps").style.display = showPositionSize ? "block" : "none";
  if(showPositionSize){
    const el = selected[0];
    document.getElementById("pX").value = el.x;
    document.getElementById("pY").value = el.y;
    document.getElementById("pW").value = el.w;
    document.getElementById("pH").value = el.h;
  }

  const zCommon = commonValue(selected, el => el.z ?? 0);
  document.getElementById("pZ").value = zCommon ?? "";
  const readOpacity = el => (el.type === "image" || el.type === "shape" || el.type === "polygon") ? (el.opacity ?? 1) : (el.fill ? el.fill.opacity ?? 1 : 1);
  const opacityCommon = commonValue(selected, readOpacity);
  document.getElementById("pOpacity").value = opacityCommon ?? 1;

  const isTextEl = el => el.type !== "image" && el.type !== "shape" && el.type !== "polygon";
  const isShapeEl = el => el.type === "shape" || el.type === "polygon";

  // Label text and per-type feed colors are inherently per-element (two
  // labels are never meant to share one string; a bulk feed-color edit
  // would silently apply to every OTHER selected element's feed too) - both
  // stay single-selection-only, same reasoning as Position & Size above.
  const allText = selected.every(isTextEl);
  document.getElementById("textProps").style.display = allText ? "block" : "none";
  if(allText){
    const texts = selected.map(el => el.text || {});
    document.getElementById("pLabelTextRow").style.display = (!bulk && selected[0].role === "label") ? "flex" : "none";
    document.getElementById("pLabelText").value = texts[0].content || "";
    // The feed role colors each line individually via the per-type pickers
    // below (el.feedColors / FEED_COLOR) - the element's own text.color is
    // never actually visible on a feed box (see renderElement's isFeed
    // branch), so showing it here would just be a control that does nothing.
    const anyFeed = selected.some(el => el.role === "feed");
    document.getElementById("pColorRow").style.display = anyFeed ? "none" : "flex";
    document.getElementById("pFontSize").value = commonValue(selected, el => (el.text || {}).fontSizePx || 24) ?? "";
    // The absolute Font Size field only makes sense when every selected
    // element should end up the SAME size. For a bulk edit you usually want
    // the opposite - grow/shrink everyone relative to their own current
    // size (a title and a caption selected together should both get
    // +2px, not both get set to one shared number) - so the step buttons
    // only appear once there's actually a group to apply that to.
    document.getElementById("pFontSizeStepRow").style.display = bulk ? "flex" : "none";
    document.getElementById("pFontWeight").value = String(commonValue(selected, el => (el.text || {}).fontWeight || 400) ?? "");
    document.getElementById("pAlign").value = commonValue(selected, el => (el.text || {}).align || "left") ?? "";
    document.getElementById("pColor").value = commonValue(selected, el => (el.text || {}).color || "#ffffff") || "#ffffff";
    document.getElementById("pFillColor").value = commonValue(selected, el => (el.fill && el.fill.color) || "#1a1e24") || "#1a1e24";
    const fillNoneCommon = commonValue(selected, el => !el.fill);
    document.getElementById("pFillNone").checked = fillNoneCommon === null ? false : fillNoneCommon;
    document.getElementById("pFillColor").disabled = fillNoneCommon === true;
    document.getElementById("pUppercase").value = commonValue(selected, el => (el.text || {}).textTransform || "none") ?? "";
    const autoSizeCommon = commonValue(selected, el => (el.text || {}).autoSize !== false);
    document.getElementById("pAutoSize").checked = autoSizeCommon === null ? false : autoSizeCommon;
  }

  // Corner radius is rectangle-only (no SVG polygon equivalent - see
  // applyShapeStyle) - every other shape control (fill/gradient/border/
  // shadow) is shared between "shape" and "polygon" alike.
  const allShapeLike = selected.every(isShapeEl);
  document.getElementById("shapeProps").style.display = allShapeLike ? "block" : "none";
  if(allShapeLike){
    document.getElementById("pCornerRadiusRow").style.display = selected.every(el => el.type === "shape") ? "flex" : "none";
    document.getElementById("pCornerRadius").value = commonValue(selected, el => el.cornerRadius ?? 0) ?? "";

    const gradientOnCommon = commonValue(selected, el => !!(el.gradient && el.gradient.enabled));
    document.getElementById("pGradientEnabled").checked = gradientOnCommon === null ? false : gradientOnCommon;
    document.getElementById("pFillSolidRow").style.display = gradientOnCommon ? "none" : "flex";
    document.getElementById("pGradientProps").style.display = gradientOnCommon ? "block" : "none";
    document.getElementById("pShapeFillColor").value = commonValue(selected, el => (el.fill && el.fill.color) || "#4f8cff") || "#4f8cff";
    document.getElementById("pGradientAngle").value = commonValue(selected, el => (el.gradient || {}).angle ?? 180) ?? 180;
    document.getElementById("pGradientStart").value = commonValue(selected, el => ((el.gradient || {}).stops || [])[0]?.color || "#4f8cff") || "#4f8cff";
    document.getElementById("pGradientEnd").value = commonValue(selected, el => ((el.gradient || {}).stops || [])[1]?.color || "#1a3a7a") || "#1a3a7a";

    document.getElementById("pBorderWidth").value = commonValue(selected, el => (el.border || {}).width ?? 0) ?? "";
    document.getElementById("pBorderColor").value = commonValue(selected, el => (el.border || {}).color || "#ffffff") || "#ffffff";

    const shadowOnCommon = commonValue(selected, el => !!(el.shadow && el.shadow.enabled));
    document.getElementById("pShadowEnabled").checked = shadowOnCommon === null ? false : shadowOnCommon;
    document.getElementById("pShadowDetailProps").style.display = shadowOnCommon ? "block" : "none";
    document.getElementById("pShadowX").value = commonValue(selected, el => (el.shadow || {}).offsetX ?? 0) ?? "";
    document.getElementById("pShadowY").value = commonValue(selected, el => (el.shadow || {}).offsetY ?? 4) ?? "";
    document.getElementById("pShadowBlur").value = commonValue(selected, el => (el.shadow || {}).blur ?? 8) ?? "";
    document.getElementById("pShadowOpacity").value = commonValue(selected, el => (el.shadow || {}).opacity ?? 0.5) ?? 0.5;
    document.getElementById("pShadowColor").value = commonValue(selected, el => (el.shadow || {}).color || "#000000") || "#000000";
  }

  renderFeedColorProps(bulk ? null : selected[0]);
  updateSizeControlsDisabled(bulk ? null : selected[0]);
  document.getElementById("btnDeleteEl").textContent = bulk ? "Delete " + selected.length + " Elements" : "Delete Element";
  document.getElementById("btnDuplicate").textContent = bulk ? "Duplicate " + selected.length + " Elements" : "Duplicate";
}

// Only shown for role === "feed" elements. One color input per
// FEED_COLOR_TYPES entry (shared with scorebug-render.js, so this list
// can't drift from what feedLabel/FEED_COLOR actually support), prefilled
// from el.feedColors when set or FEED_COLOR's built-in default otherwise.
// Rebuilt from scratch on every call rather than diffed in place - the
// props panel only re-renders on selection change, not per keystroke, so
// this is cheap.
function renderFeedColorProps(el){
  const wrap = document.getElementById("feedColorProps");
  if(!el || el.role !== "feed"){
    wrap.style.display = "none";
    wrap.innerHTML = "<h3>Feed Colors</h3>";
    return;
  }
  wrap.style.display = "block";
  wrap.innerHTML = "<h3>Feed Colors</h3>";
  el.feedColors = el.feedColors || {};
  FEED_COLOR_TYPES.forEach(type => {
    const row = document.createElement("div");
    row.className = "row";
    const cell = document.createElement("div");
    const label = document.createElement("label");
    label.textContent = FEED_TYPE_LABEL[type] || type;
    const input = document.createElement("input");
    input.type = "color";
    input.value = el.feedColors[type] || FEED_COLOR[type] || "#ffffff";
    input.addEventListener("input", () => {
      el.feedColors[type] = input.value;
      redrawCanvas();
    });
    cell.appendChild(label);
    cell.appendChild(input);
    row.appendChild(cell);
    wrap.appendChild(row);
  });
}

const FEED_TYPE_LABEL = {
  goal: "Goal",
  penalty_minor: "Minor penalty",
  penalty_major: "Major penalty",
  turnover: "Turnover",
  ejection: "Ejection",
  timeout: "Timeout",
};

// W/H and the drag-resize handle only make sense for a box whose size is
// manually set - once autoSize is on, w/h are derived from the rendered
// text every redraw (see renderElement), so manual input would just get
// overwritten on the next render. The feed role is the one exception:
// renderElement never autosizes it regardless of el.text.autoSize (a fixed,
// author-sized viewport, not a box that hugs however much text is in it
// right now) - see the isFeed guard in renderElement.
function isAutoSizedElement(el){
  // autoSize is a dataText-only concept (hug the resolved text's measured
  // size - see renderElement). image/shape/polygon elements have no
  // element.text at all, so the old `(el.text || {}).autoSize !== false`
  // check defaulted to true for them by accident (undefined !== false),
  // which hid their resize handle entirely - a shape could never be
  // manually resized once that check started also running for the new
  // element types.
  if (!el || el.type === "image" || el.type === "shape" || el.type === "polygon") return false;
  return el.role !== "feed" && (el.text || {}).autoSize !== false;
}

function updateSizeControlsDisabled(el){
  const isAutoSized = isAutoSizedElement(el);
  document.getElementById("pW").disabled = isAutoSized;
  document.getElementById("pH").disabled = isAutoSized;
}

// bulkable: true means this field applies to every selected element at
// once (Z, opacity, text style) - position/size fields leave it false,
// since "same X for every selected element" isn't a sensible bulk edit the
// way "same font size" is (see the Position & Size section's own
// multi-select handling in renderPropsPanel, which hides those fields
// entirely rather than bulk-applying them).
function bindPropInput(id, fn, { bulkable } = {}){
  const input = document.getElementById(id);
  // One history entry per editing SESSION, not per keystroke/slider tick -
  // snapshotting on focus (before the first input event) means undo
  // reverts the whole typed value or the whole slider drag in one step,
  // same granularity as drag/resize's own mousedown-time commitHistory().
  // A second focus without a blur in between (tab away and back without
  // changing anything) would double-commit an identical snapshot, which is
  // harmless - undo would just need pressing twice to see a difference.
  let committedThisSession = false;
  input.addEventListener("focus", () => { committedThisSession = false; });
  input.addEventListener("input", () => {
    const targets = bulkable ? selectedElements() : (currentElement() ? [currentElement()] : []);
    if(targets.length === 0) return;
    if(!committedThisSession){
      commitHistory();
      committedThisSession = true;
    }
    const v = input.value;
    targets.forEach(el => fn(el, v));
    redrawCanvas();
  });
}

bindPropInput("pX", (el, v) => el.x = parseFloat(v) || 0);
bindPropInput("pY", (el, v) => el.y = parseFloat(v) || 0);
bindPropInput("pW", (el, v) => el.w = parseFloat(v) || 10);
bindPropInput("pH", (el, v) => el.h = parseFloat(v) || 10);
bindPropInput("pZ", (el, v) => el.z = parseInt(v, 10) || 0, { bulkable: true });
bindPropInput("pOpacity", (el, v) => {
  // image/shape/polygon all carry their own top-level opacity, read
  // straight through by renderElement. A dataText element has no such
  // field - opacity there has only ever meant "opacity of the optional
  // background fill box behind the text" (see renderElement's text-fill
  // branch, which applies element.fill.opacity to the whole node), so it
  // stays routed through fill.opacity to match what that field has always
  // actually controlled.
  if(el.type === "image" || el.type === "shape" || el.type === "polygon") el.opacity = parseFloat(v);
  else { el.fill = el.fill || { color: "#1a1e24" }; el.fill.opacity = parseFloat(v); }
}, { bulkable: true });
bindPropInput("pLabelText", (el, v) => { el.text = el.text || {}; el.text.content = v; });
bindPropInput("pFontSize", (el, v) => { el.text = el.text || {}; el.text.fontSizePx = parseInt(v, 10) || 24; }, { bulkable: true });
bindPropInput("pFontWeight", (el, v) => { el.text = el.text || {}; el.text.fontWeight = parseInt(v, 10); }, { bulkable: true });
bindPropInput("pAlign", (el, v) => { el.text = el.text || {}; el.text.align = v; }, { bulkable: true });
bindPropInput("pColor", (el, v) => { el.text = el.text || {}; el.text.color = v; }, { bulkable: true });
bindPropInput("pFillColor", (el, v) => { el.fill = el.fill || {}; el.fill.color = v; el.fill.opacity = el.fill.opacity ?? 1; }, { bulkable: true });
bindPropInput("pUppercase", (el, v) => { el.text = el.text || {}; el.text.textTransform = v; }, { bulkable: true });

// "None" clears el.fill entirely rather than setting some sentinel color -
// renderElement already treats a missing/falsy el.fill as fully transparent
// (see its `if (element.fill && element.fill.color)` guard), which is
// exactly a never-touched text element's default appearance. Re-checking
// the color swatch afterward restores whatever color was last set, so
// toggling None off and on doesn't lose your previous choice.
document.getElementById("pFillNone").addEventListener("change", () => {
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  const none = document.getElementById("pFillNone").checked;
  const colorInput = document.getElementById("pFillColor");
  targets.forEach(el => {
    if(none){
      el._lastFillColor = el.fill ? { ...el.fill } : el._lastFillColor;
      el.fill = null;
    } else {
      el.fill = el._lastFillColor || { color: colorInput.value || "#1a1e24", opacity: 1 };
    }
  });
  colorInput.disabled = none;
  redrawCanvas();
  renderPropsPanel();
});

// Relative bulk resize: unlike every other bulkable field (which sets the
// SAME value on every selected element), these nudge each element's own
// fontSizePx by the step - a title and a caption selected together each
// grow by 2px from wherever they already were, rather than converging on
// one shared size. Only rendered/reachable in bulk mode - see
// renderPropsPanel's pFontSizeStepRow toggle.
const FONT_SIZE_STEP = 2;
function stepSelectedFontSizes(delta){
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  targets.forEach(el => {
    el.text = el.text || {};
    el.text.fontSizePx = Math.max(1, (el.text.fontSizePx || 24) + delta);
  });
  redrawCanvas();
  renderPropsPanel();
}
document.getElementById("pFontSizeStepDown").addEventListener("click", () => stepSelectedFontSizes(-FONT_SIZE_STEP));
document.getElementById("pFontSizeStepUp").addEventListener("click", () => stepSelectedFontSizes(FONT_SIZE_STEP));

document.getElementById("pAutoSize").addEventListener("change", () => {
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  const checked = document.getElementById("pAutoSize").checked;
  targets.forEach(el => {
    el.text = el.text || {};
    el.text.autoSize = checked;
  });
  if(targets.length === 1) updateSizeControlsDisabled(targets[0]);
  redrawCanvas();
});

/* ---- shape/polygon style bindings (bulkable - a selected group of boxes
   commonly wants the same corner radius / border / shadow applied at once) ---- */
bindPropInput("pCornerRadius", (el, v) => el.cornerRadius = Math.max(0, parseFloat(v) || 0), { bulkable: true });
bindPropInput("pShapeFillColor", (el, v) => { el.fill = el.fill || {}; el.fill.color = v; }, { bulkable: true });
bindPropInput("pGradientAngle", (el, v) => { el.gradient = el.gradient || {}; el.gradient.angle = parseFloat(v) || 0; }, { bulkable: true });
bindPropInput("pGradientStart", (el, v) => {
  el.gradient = el.gradient || {};
  el.gradient.stops = el.gradient.stops || [{ offset: 0 }, { offset: 100 }];
  el.gradient.stops[0] = { ...el.gradient.stops[0], color: v, offset: el.gradient.stops[0]?.offset ?? 0 };
}, { bulkable: true });
bindPropInput("pGradientEnd", (el, v) => {
  el.gradient = el.gradient || {};
  el.gradient.stops = el.gradient.stops || [{ offset: 0 }, { offset: 100 }];
  el.gradient.stops[1] = { ...el.gradient.stops[1], color: v, offset: el.gradient.stops[1]?.offset ?? 100 };
}, { bulkable: true });
bindPropInput("pBorderWidth", (el, v) => { el.border = el.border || {}; el.border.width = Math.max(0, parseFloat(v) || 0); }, { bulkable: true });
bindPropInput("pBorderColor", (el, v) => { el.border = el.border || {}; el.border.color = v; }, { bulkable: true });
bindPropInput("pShadowX", (el, v) => { el.shadow = el.shadow || {}; el.shadow.offsetX = parseFloat(v) || 0; }, { bulkable: true });
bindPropInput("pShadowY", (el, v) => { el.shadow = el.shadow || {}; el.shadow.offsetY = parseFloat(v) || 0; }, { bulkable: true });
bindPropInput("pShadowBlur", (el, v) => { el.shadow = el.shadow || {}; el.shadow.blur = Math.max(0, parseFloat(v) || 0); }, { bulkable: true });
bindPropInput("pShadowOpacity", (el, v) => { el.shadow = el.shadow || {}; el.shadow.opacity = parseFloat(v); }, { bulkable: true });
bindPropInput("pShadowColor", (el, v) => { el.shadow = el.shadow || {}; el.shadow.color = v; }, { bulkable: true });

document.getElementById("pGradientEnabled").addEventListener("change", () => {
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  const checked = document.getElementById("pGradientEnabled").checked;
  targets.forEach(el => {
    el.gradient = el.gradient || { angle: 180, stops: [{ color: "#4f8cff", offset: 0 }, { color: "#1a3a7a", offset: 100 }] };
    el.gradient.enabled = checked;
  });
  redrawCanvas();
  renderPropsPanel();
});

document.getElementById("pShadowEnabled").addEventListener("change", () => {
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  const checked = document.getElementById("pShadowEnabled").checked;
  targets.forEach(el => {
    el.shadow = el.shadow || { offsetX: 0, offsetY: 4, blur: 8, color: "#000000", opacity: 0.5 };
    el.shadow.enabled = checked;
  });
  redrawCanvas();
  renderPropsPanel();
});

document.getElementById("btnDeleteEl").addEventListener("click", () => {
  if(selectedIds.size === 0) return;
  commitHistory();
  preset.elements = preset.elements.filter(e => !selectedIds.has(e.id));
  selectElement(null);
});

// Moves every selected element's z above the current highest (Front) or
// below the current lowest (Back) in the whole preset, preserving their
// relative order to each other when more than one is selected (so bulk-
// selecting three overlapping shapes and hitting Front doesn't scramble
// which of those three ends up on top of the others).
function restackSelection(toFront){
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  const others = preset.elements.filter(el => !selectedIds.has(el.id));
  const edge = others.reduce((acc, el) => toFront ? Math.max(acc, el.z ?? 0) : Math.min(acc, el.z ?? 0), toFront ? -Infinity : Infinity);
  const base = others.length === 0 ? 0 : edge;
  const ordered = [...targets].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));
  ordered.forEach((el, i) => {
    el.z = toFront ? base + 1 + i : base - ordered.length + i;
  });
  redrawCanvas();
  renderPropsPanel();
}
document.getElementById("btnBringToFront").addEventListener("click", () => restackSelection(true));
document.getElementById("btnSendToBack").addEventListener("click", () => restackSelection(false));

// Clones every selected element with a fresh id, nudged down-right so the
// copy is never exactly on top of (and so indistinguishable from) its
// original, placed above everything (genElId/z both reuse the same "add new
// content on top" convention the palette/shape/logo buttons already use -
// unlike a brand-new shape, a duplicate of something already on the canvas
// has no reason to default behind it). The new copies become the selection,
// same as every other "add" action, so they're immediately ready to drag
// into position.
const DUPLICATE_OFFSET = 24;
function duplicateSelection(){
  const targets = selectedElements();
  if(targets.length === 0) return;
  commitHistory();
  const copies = targets.map(el => {
    const copy = JSON.parse(JSON.stringify(el));
    copy.id = genElId();
    copy.z = (el.z ?? 0) + 1;
    if(copy.type === "polygon"){
      copy.points = copy.points.map(p => ({ x: p.x + DUPLICATE_OFFSET, y: p.y + DUPLICATE_OFFSET }));
    } else {
      copy.x = el.x + DUPLICATE_OFFSET;
      copy.y = el.y + DUPLICATE_OFFSET;
    }
    return copy;
  });
  preset.elements.push(...copies);
  selectElement(copies.map(c => c.id));
}
document.getElementById("btnDuplicate").addEventListener("click", duplicateSelection);

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if(!mod || e.key.toLowerCase() !== "d") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  e.preventDefault(); // browsers bind Ctrl/Cmd+D to "bookmark this page" otherwise
  duplicateSelection();
});

/* ---- grid + smart alignment guides (Keynote/PowerPoint-style snapping) ---- */
const GRID_SIZE = 50;
const SNAP_PX = 6; // in true canvas px, independent of zoom - how close counts as "aligned"
let gridOn = false;

const btnToggleGrid = document.getElementById("btnToggleGrid");
btnToggleGrid.addEventListener("click", () => {
  gridOn = !gridOn;
  canvas.classList.toggle("showGrid", gridOn);
  btnToggleGrid.textContent = "Grid: " + (gridOn ? "On" : "Off");
});

function snapToGrid(v){
  return Math.round(v / GRID_SIZE) * GRID_SIZE;
}

// Edge/center positions (in canvas space) of every element except those
// being moved, used as candidate snap targets for the dragged element's own
// edges/center - same idea as Keynote/PowerPoint's smart guides. Each
// candidate also carries whether it's the canvas's own centerline (as
// opposed to another element's edge/center), so findSnap/drawGuide can
// call that one out in red - it's the one alignment that matters for
// "is this centered on the broadcast frame", not just "lines up with
// something else nearby".
//
// excludeIds may be a single id or a Set - a group drag excludes every
// element in the selection (not just the one edge being used to compute
// the snap delta), otherwise moving a multi-selection could "snap" against
// another member of the same selection that's just along for the ride.
function otherElementEdges(excludeIds){
  const exclude = excludeIds instanceof Set ? excludeIds : new Set([excludeIds]);
  const canvasW = (preset.canvas && preset.canvas.width) || 1920;
  const canvasH = (preset.canvas && preset.canvas.height) || 1080;
  const xs = [{ at: canvasW / 2, isCenter: true }];
  const ys = [{ at: canvasH / 2, isCenter: true }];
  preset.elements.forEach(el => {
    if(exclude.has(el.id)) return;
    xs.push({ at: el.x }, { at: el.x + el.w / 2 }, { at: el.x + el.w });
    ys.push({ at: el.y }, { at: el.y + el.h / 2 }, { at: el.y + el.h });
  });
  return { xs, ys };
}

// Given the moving box's candidate edges on one axis, find the single
// closest snap target (grid line, canvas centerline, or another element's
// edge/center) within SNAP_PX, trying the box's start edge, center, and end
// edge against every candidate. Returns {delta, guideAt, isCenter} or null
// if nothing's close enough.
function findSnap(boxStart, boxSize, candidates, gridSnapEnabled){
  const boxPoints = [boxStart, boxStart + boxSize / 2, boxStart + boxSize];
  let best = null;
  const consider = (target, boxPoint, isCenter) => {
    const delta = target - boxPoint;
    if(Math.abs(delta) <= SNAP_PX && (!best || Math.abs(delta) < Math.abs(best.delta))){
      best = { delta, guideAt: target, isCenter: !!isCenter };
    }
  };
  boxPoints.forEach(bp => {
    candidates.forEach(c => consider(c.at, bp, c.isCenter));
    if(gridSnapEnabled) consider(snapToGrid(bp), bp, false);
  });
  return best;
}

function clearGuides(){
  canvas.querySelectorAll(".guide").forEach(g => g.remove());
}

function drawGuide(axis, at, isCenter){
  const g = document.createElement("div");
  g.className = "guide " + (axis === "x" ? "v" : "h") + (isCenter ? " center" : "");
  if(axis === "x") g.style.left = at + "px";
  else g.style.top = at + "px";
  canvas.appendChild(g);
}

/* ---- drag / resize (true-canvas-space coordinates, independent of CSS scale) ---- */
function canvasScale(){
  const t = canvas.style.transform.match(/scale\(([\d.]+)\)/);
  return t ? parseFloat(t[1]) : 1;
}

function startDrag(e, element){
  e.preventDefault();

  // Shift-click toggles this element in/out of the selection and never
  // starts a drag - same convention as every other multi-select canvas
  // (PowerPoint, Figma, etc.), so you can build up a selection with
  // several clicks before moving anything.
  if(e.shiftKey){
    toggleElementSelection(element.id);
    return;
  }

  // Plain click on an element already part of a multi-selection drags the
  // whole group, preserving each member's offset from the others. Plain
  // click on anything else (including a different member of no
  // selection) collapses to selecting just that one element, matching
  // every prior single-select click.
  if(!selectedIds.has(element.id) || selectedIds.size <= 1) selectElement(element.id);

  // Snapshot BEFORE the drag moves anything - a click with no actual
  // movement (just a selection change) still pushes one history entry,
  // which is harmless (undo would just reselect) rather than worth the
  // complexity of detecting "did the mouse move enough to count."
  commitHistory();

  const scale = canvasScale();
  const startX = e.clientX, startY = e.clientY;
  // A polygon's x/y are a derived readout of its points' bounding box (see
  // buildPolygonNode), recomputed from scratch on every render - setting
  // element.x/y directly during a drag would just get silently overwritten
  // back to wherever the points already are on the very next redraw. Its
  // origPoints snapshot lets onMove translate every vertex by the same
  // delta instead, which is what actually moves it.
  const group = selectedElements().map(el => ({
    el, origX: el.x, origY: el.y,
    origPoints: el.type === "polygon" ? el.points.map(p => ({ ...p })) : null,
  }));
  const primary = group.find(g => g.el.id === element.id) || group[0];

  // The group's own bounding box (not just the clicked element's box) is
  // what should snap/guide during a multi-element drag - snapping only the
  // primary element's box means the grid line (or another element's edge)
  // lines up with whichever element you happened to grab, not with the
  // selection as a whole, so a 3-up row's actual center could be well off
  // the grid even though the reported "snap" fired correctly for the one
  // box it was computed against.
  const boundsX0 = Math.min(...group.map(g => g.origX));
  const boundsY0 = Math.min(...group.map(g => g.origY));
  const boundsX1 = Math.max(...group.map(g => g.origX + g.el.w));
  const boundsY1 = Math.max(...group.map(g => g.origY + g.el.h));
  const boundsW = boundsX1 - boundsX0, boundsH = boundsY1 - boundsY0;

  function onMove(me){
    let x = primary.origX + (me.clientX - startX) / scale;
    let y = primary.origY + (me.clientY - startY) / scale;

    // Snap the group's bounding box, not primary's box - boundsX0/Y0 move
    // by the same delta as primary (both are rigidly offset from it), so
    // the box handed to findSnap is "where the group's bounds would be
    // right now", in sync with the as-yet-unsnapped x/y above.
    const groupX = x - (primary.origX - boundsX0);
    const groupY = y - (primary.origY - boundsY0);

    const { xs, ys } = otherElementEdges(selectedIds);
    const snapX = findSnap(groupX, boundsW, xs, gridOn);
    const snapY = findSnap(groupY, boundsH, ys, gridOn);
    if(snapX) x += snapX.delta;
    if(snapY) y += snapY.delta;

    const dx = Math.round(x) - primary.origX;
    const dy = Math.round(y) - primary.origY;
    group.forEach(g => {
      if(g.origPoints){
        g.el.points = g.origPoints.map(p => ({ x: p.x + dx, y: p.y + dy }));
      } else {
        g.el.x = g.origX + dx;
        g.el.y = g.origY + dy;
      }
    });
    redrawCanvas();
    renderPropsPanel();

    clearGuides();
    if(snapX) drawGuide("x", snapX.guideAt, snapX.isCenter);
    if(snapY) drawGuide("y", snapY.guideAt, snapY.isCenter);
  }
  function onUp(){
    clearGuides();
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

function startResize(e, element){
  e.preventDefault();
  selectElement(element.id);
  commitHistory();
  const scale = canvasScale();
  const startX = e.clientX, startY = e.clientY;
  const origW = element.w, origH = element.h;
  function onMove(me){
    let w = Math.max(10, origW + (me.clientX - startX) / scale);
    let h = Math.max(10, origH + (me.clientY - startY) / scale);

    // Snap the resizing (bottom-right) edge against other elements' edges
    // and the grid, same tolerance as drag - the edge being dragged is
    // element.x + w / element.y + h, so solve the delta in terms of w/h.
    const { xs, ys } = otherElementEdges(element.id);
    const rightEdge = element.x + w, bottomEdge = element.y + h;
    const snapX = findSnap(rightEdge, 0, xs, gridOn);
    const snapY = findSnap(bottomEdge, 0, ys, gridOn);
    if(snapX) w += snapX.delta;
    if(snapY) h += snapY.delta;

    element.w = Math.max(10, Math.round(w));
    element.h = Math.max(10, Math.round(h));
    redrawCanvas();
    renderPropsPanel();

    clearGuides();
    if(snapX) drawGuide("x", snapX.guideAt, snapX.isCenter);
    if(snapY) drawGuide("y", snapY.guideAt, snapY.isCenter);
  }
  function onUp(){
    clearGuides();
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

// One draggable circle per vertex of the selected polygon, in canvas-space
// coordinates (same coordinate system element.points already uses, so no
// conversion needed beyond canvasPoint's screen->canvas mapping). Dragging
// a handle mutates that single point in place and re-renders - the
// polygon's SVG bounding box (and so element.x/y/w/h) is recomputed from
// scratch on every redraw by buildPolygonNode, so there's nothing extra to
// keep in sync here beyond the point itself.
function renderPolygonHandles(element){
  const scale = canvasScale();
  (element.points || []).forEach((point, i) => {
    const handle = document.createElement("div");
    handle.className = "vertex-handle";
    handle.style.left = point.x + "px";
    handle.style.top = point.y + "px";
    handle.addEventListener("mousedown", e => {
      e.preventDefault();
      e.stopPropagation();
      commitHistory();
      function onMove(me){
        const p = canvasPoint(me);
        element.points[i] = { x: Math.round(p.x), y: Math.round(p.y) };
        redrawCanvas();
      }
      function onUp(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    canvas.appendChild(handle);
  });
}

// ---- draw-polygon tool: click to place vertices, double-click/Enter to close ----
// Active only between clicking "Draw Polygon..." and finishing the shape -
// a single module-level flag rather than yet another per-element mode,
// since only one polygon can be mid-construction at a time and nothing
// else on the canvas should be interactive while it is (see the capturing
// click handler below, which runs before any element's own mousedown).
let polygonDraft = null; // { points: [{x,y},...] } while drawing, else null

const btnDrawPolygon = document.getElementById("btnDrawPolygon");

function startPolygonDraft(){
  polygonDraft = { points: [] };
  canvas.classList.add("drawingPolygon");
  btnDrawPolygon.textContent = "Cancel Polygon (Esc)";
  document.getElementById("polygonHint").style.display = "block";
  renderPolygonDraft();
}

function finishPolygonDraft(){
  if(polygonDraft && polygonDraft.points.length >= 3){
    commitHistory();
    const element = {
      id: genElId(),
      type: "polygon",
      points: polygonDraft.points,
      z: zBehindEverything(),
      visible: true,
      opacity: 1,
      fill: { color: "#4f8cff" },
      gradient: { enabled: false, angle: 180, stops: [{ color: "#4f8cff", offset: 0 }, { color: "#1a3a7a", offset: 100 }] },
      border: { width: 0, color: "#ffffff" },
      shadow: { enabled: false, offsetX: 0, offsetY: 4, blur: 8, color: "#000000", opacity: 0.5 },
    };
    preset.elements.push(element);
    selectElement(element.id);
  }
  cancelPolygonDraft();
}

function cancelPolygonDraft(){
  polygonDraft = null;
  canvas.classList.remove("drawingPolygon");
  btnDrawPolygon.textContent = "Draw Polygon...";
  document.getElementById("polygonHint").style.display = "none";
  const dots = canvas.querySelectorAll(".polygon-draft-dot, #polygonDraftLine");
  dots.forEach(d => d.remove());
  if(selectedIds.size === 0) renderPropsPanel();
}

function renderPolygonDraft(){
  canvas.querySelectorAll(".polygon-draft-dot").forEach(d => d.remove());
  if(!polygonDraft) return;
  polygonDraft.points.forEach(p => {
    const dot = document.createElement("div");
    dot.id = "polygonDraftDot";
    dot.className = "polygon-draft-dot";
    dot.style.left = p.x + "px";
    dot.style.top = p.y + "px";
    canvas.appendChild(dot);
  });
}

document.getElementById("btnDrawPolygon").addEventListener("click", () => {
  if(polygonDraft) cancelPolygonDraft();
  else startPolygonDraft();
});

// Capturing listener so a click meant to place a polygon vertex never also
// triggers the canvas's own empty-space marquee handler or an element's
// drag handler underneath the cursor - this fires and stops propagation
// before either of those ever sees the event.
canvas.addEventListener("mousedown", e => {
  if(!polygonDraft) return;
  e.preventDefault();
  e.stopPropagation();
  const p = canvasPoint(e);
  polygonDraft.points.push({ x: Math.round(p.x), y: Math.round(p.y) });
  renderPolygonDraft();
}, true);

canvas.addEventListener("dblclick", e => {
  if(!polygonDraft) return;
  e.preventDefault();
  e.stopPropagation();
  finishPolygonDraft();
}, true);

document.addEventListener("keydown", e => {
  if(!polygonDraft) return;
  if(e.key === "Enter") finishPolygonDraft();
  else if(e.key === "Escape") cancelPolygonDraft();
});

// Rubber-band marquee select: mousedown on empty canvas starts a drag
// rectangle (true canvas-space coordinates, same as everything else here);
// on mouseup, every element whose box intersects the rectangle becomes the
// selection (shift extends the existing selection instead of replacing it,
// consistent with startDrag's shift-click toggle on individual elements).
// A plain click with no drag (the common "click empty space to deselect"
// gesture) falls out of this naturally - a near-zero-size rectangle
// intersects nothing, so the result is just an empty selection.
function canvasPoint(e){
  const rect = canvas.getBoundingClientRect();
  const scale = canvasScale();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function rectsIntersect(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

canvas.addEventListener("mousedown", e => {
  if(e.target !== canvas) return;
  e.preventDefault();

  const start = canvasPoint(e);
  const baseSelection = e.shiftKey ? new Set(selectedIds) : new Set();
  const marquee = document.createElement("div");
  marquee.id = "marquee";
  canvas.appendChild(marquee);

  function updateMarqueeRect(x, y, w, h){
    marquee.style.left = x + "px";
    marquee.style.top = y + "px";
    marquee.style.width = w + "px";
    marquee.style.height = h + "px";
    return { x, y, w, h };
  }

  function onMove(me){
    const cur = canvasPoint(me);
    const x = Math.min(start.x, cur.x), y = Math.min(start.y, cur.y);
    const w = Math.abs(cur.x - start.x), h = Math.abs(cur.y - start.y);
    const rect = updateMarqueeRect(x, y, w, h);

    const hit = preset.elements.filter(el => rectsIntersect(rect, { x: el.x, y: el.y, w: el.w, h: el.h }));
    // Not selectElement() here - that also rebuilds the properties panel on
    // every pixel of mouse movement, and redrawCanvas() below already wipes
    // and rebuilds #canvas's children (including this marquee div), so it
    // has to be re-appended after each redraw rather than created once.
    selectedIds = new Set([...baseSelection, ...hit.map(el => el.id)]);
    redrawCanvas();
    canvas.appendChild(marquee);
  }
  function onUp(){
    marquee.remove();
    renderPropsPanel();
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
});

/* ---- palette: add a new data-bound element ---- */
document.querySelectorAll("#palette button[data-role]").forEach(btn => {
