/* ---- logo upload ---- */
const logoFileInput = document.getElementById("logoFile");

document.getElementById("btnAddLogo").addEventListener("click", () => {
  logoFileInput.click();
});

logoFileInput.addEventListener("change", async () => {
  const file = logoFileInput.files[0];
  logoFileInput.value = ""; // allow re-selecting the same file later
  if(!file) return;

  const formData = new FormData();
  formData.append("logo", file);

  let result;
  try {
    const res = await fetch("/api/logos", { method: "POST", body: formData });
    if(!res.ok){
      const err = await res.json().catch(() => ({}));
      alert("Logo upload failed: " + (err.error || res.statusText));
      return;
    }
    result = await res.json();
  } catch (e) {
    alert("Logo upload failed: " + e.message);
    return;
  }

  // Place at native size (capped so a huge source image doesn't blow past
  // the canvas), centered-ish, same z-stacking convention as data elements.
  commitHistory();
  const maxDim = 480;
  const scale = Math.min(1, maxDim / Math.max(result.width, result.height));
  const element = {
    id: genElId(),
    type: "image",
    assetId: result.assetId,
    x: 200, y: 200,
    w: Math.round(result.width * scale), h: Math.round(result.height * scale),
    z: preset.elements.length + 1,
    opacity: 1,
    visible: true,
  };
  preset.elements.push(element);
  selectElement(element.id);
});

/* ---- preset list / version list / load / save / new / delete ---- */
const presetSelect = document.getElementById("presetSelect");
const versionSelect = document.getElementById("versionSelect");
const presetNameInput = document.getElementById("presetName");
const saveStatus = document.getElementById("saveStatus");

async function refreshPresetList(selectId){
  const res = await fetch("/api/presets");
  const list = await res.json();
  presetSelect.innerHTML = '<option value="">New preset...</option>' +
    list.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
  if(selectId) presetSelect.value = selectId;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function fmtTime(iso){
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// Rebuilds the version dropdown from fullPresetDoc, newest first, marking
// which one is this preset's live-when-active version and which one is
// currently loaded on canvas.
function refreshVersionSelect(){
  if(!fullPresetDoc){
    versionSelect.innerHTML = "";
    versionSelect.style.display = "none";
    return;
  }
  versionSelect.style.display = "";
  const sorted = [...fullPresetDoc.versions].sort((a, b) => b.version - a.version);
  versionSelect.innerHTML = sorted.map(v => {
    const activeTag = v.version === fullPresetDoc.activeVersion ? " [active]" : "";
    return `<option value="${v.version}">v${v.version} — ${fmtTime(v.createdAt)}${activeTag}</option>`;
  }).join("");
  versionSelect.value = String(viewingVersion ?? fullPresetDoc.activeVersion);
}

// Older saved versions can carry duplicate element ids (a bug in an
// earlier build of this editor let nextElSeq restart at 1 on every page
// load instead of continuing past ids already in the preset, so a newly
// added element could collide with one from a prior session). A
// duplicate id breaks every id-based lookup in this file (selection,
// delete, property edits) ambiguously, silently affecting whichever
// element happens to come first in the array - which can look like
// "editing one element changed/deleted a completely different one".
// Rewrite any collision to a fresh id on load, before anything else
// reads these elements, so old corrupted saves self-heal instead of
// staying broken forever.
function dedupeElementIds(elements){
  const seen = new Set();
  let nextFreeSeq = 1;
  const usedNumbers = new Set();
  elements.forEach(el => {
    const m = /^el_(\d+)$/.exec(el.id || "");
    if(m) usedNumbers.add(parseInt(m[1], 10));
  });
  function freshId(){
    while(usedNumbers.has(nextFreeSeq)) nextFreeSeq++;
    usedNumbers.add(nextFreeSeq);
    return "el_" + (nextFreeSeq++);
  }
  elements.forEach(el => {
    if(seen.has(el.id)){
      console.warn("Fixing duplicate element id on load:", el.id, "-> reassigning");
      el.id = freshId();
    }
    seen.add(el.id);
  });
  return elements;
}

function loadVersionIntoCanvas(version){
  viewingVersion = version.version;
  const elements = dedupeElementIds(JSON.parse(JSON.stringify(version.elements || [])));
  preset = { canvas: version.canvas, elements };
  resyncElIdCounter();
  selectedIds = new Set();
  // Undo/redo is scoped to one continuous editing session on one loaded
  // preset version - stepping back further than "the oldest change since I
  // opened this version" would mean undo could silently jump you into a
  // DIFFERENT preset's content, which is more surprising than useful.
  undoStack = [];
  redoStack = [];
  redrawCanvas();
  renderPropsPanel();
  refreshVersionSelect();
  updateActiveStatus();
  markSnapshotClean();
  rememberLastPreset();
}

async function loadPreset(id){
  const res = await fetch("/api/presets/" + id);
  if(!res.ok){ alert("Failed to load preset"); return; }
  fullPresetDoc = await res.json();
  presetMeta = { id: fullPresetDoc.id, name: fullPresetDoc.name };
  presetNameInput.value = fullPresetDoc.name;
  const active = fullPresetDoc.versions.find(v => v.version === fullPresetDoc.activeVersion) || fullPresetDoc.versions[fullPresetDoc.versions.length - 1];
  loadVersionIntoCanvas(active);
}

// ---- remember/restore the last preset+version worked on across reloads ----
//
// Per-browser convenience, not shared or server-authoritative state - this
// is purely "what was I looking at last time I had this editor open", so
// localStorage (this viewer's own browser) is the right place for it, not
// gameState or a server endpoint. Keyed to the SPECIFIC version last saved
// (not just the preset, and not necessarily its live/active version -
// those can differ), since "last saved version" is what was asked for.
const LAST_PRESET_KEY = "scorebored.editor.lastPreset";

function rememberLastPreset(){
  if(!presetMeta || viewingVersion == null) return;
  try {
    localStorage.setItem(LAST_PRESET_KEY, JSON.stringify({ id: presetMeta.id, version: viewingVersion }));
  } catch (e) { /* private browsing / storage disabled - just skip remembering */ }
}

function forgetLastPreset(){
  try { localStorage.removeItem(LAST_PRESET_KEY); } catch (e) { /* ditto */ }
}

// Loads the exact version last saved, falling back to the preset's active
// version (loadPreset's own default) if that specific version somehow no
// longer exists - e.g. prior-save point was since deleted another way.
async function restoreLastPreset(){
  let last;
  try { last = JSON.parse(localStorage.getItem(LAST_PRESET_KEY) || "null"); } catch (e) { return false; }
  if(!last || !last.id) return false;

  const res = await fetch("/api/presets/" + last.id);
  if(!res.ok) { forgetLastPreset(); return false; }
  fullPresetDoc = await res.json();
  presetMeta = { id: fullPresetDoc.id, name: fullPresetDoc.name };
  presetNameInput.value = fullPresetDoc.name;
  presetSelect.value = fullPresetDoc.id;

  const wanted = fullPresetDoc.versions.find(v => v.version === last.version);
  const fallback = fullPresetDoc.versions.find(v => v.version === fullPresetDoc.activeVersion) || fullPresetDoc.versions[fullPresetDoc.versions.length - 1];
  loadVersionIntoCanvas(wanted || fallback);
  return true;
}

presetSelect.addEventListener("change", async () => {
  const id = presetSelect.value;
  if(!id){
    presetMeta = null;
    fullPresetDoc = null;
    viewingVersion = null;
    preset = blankPreset();
    presetNameInput.value = "";
    selectedIds = new Set();
    nextElSeq = 1;
    undoStack = [];
    redoStack = [];
    redrawCanvas();
    renderPropsPanel();
    refreshVersionSelect();
    updateActiveStatus();
    markSnapshotClean();
    forgetLastPreset();
    return;
  }
  await loadPreset(id);
});

versionSelect.addEventListener("change", () => {
  const version = parseInt(versionSelect.value, 10);
  const v = fullPresetDoc.versions.find(v => v.version === version);
  if(v) loadVersionIntoCanvas(v);
});

document.getElementById("btnNew").addEventListener("click", () => {
  presetMeta = null;
  fullPresetDoc = null;
  viewingVersion = null;
  preset = blankPreset();
  presetNameInput.value = "";
  presetSelect.value = "";
  selectedIds = new Set();
  nextElSeq = 1;
  undoStack = [];
  redoStack = [];
  redrawCanvas();
  renderPropsPanel();
  refreshVersionSelect();
  updateActiveStatus();
  markSnapshotClean();
});

// Always appends a new version - never overwrites one, and never changes
// what's live on its own (per confirmed design: a draft can't surprise
// the broadcast). "Set Active" below is the only thing that goes live.
document.getElementById("btnSave").addEventListener("click", async () => {
  const name = presetNameInput.value.trim(); // blank -> server auto-names it
  const isNewPreset = !presetMeta;
  const url = isNewPreset ? "/api/presets" : "/api/presets/" + presetMeta.id + "/versions";
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, canvas: preset.canvas, elements: preset.elements }),
  });
  if(!res.ok){
    saveStatus.textContent = "Save failed";
    return;
  }
  fullPresetDoc = await res.json();
  presetMeta = { id: fullPresetDoc.id, name: fullPresetDoc.name };
  presetNameInput.value = fullPresetDoc.name;
  const newVersion = fullPresetDoc.versions[fullPresetDoc.versions.length - 1];
  viewingVersion = newVersion.version;
  saveStatus.textContent = "Saved v" + newVersion.version + " " + fmtTime(fullPresetDoc.updatedAt) + " (not live yet)";
  refreshVersionSelect();
  await refreshPresetList(fullPresetDoc.id);
  updateActiveStatus();
  markSnapshotClean();
  rememberLastPreset();
});

document.getElementById("btnDelete").addEventListener("click", async () => {
  if(!presetMeta) return;
  if(!confirm('Delete preset "' + presetMeta.name + '" and all its versions?')) return;
  await fetch("/api/presets/" + presetMeta.id, { method: "DELETE" });
  presetMeta = null;
  fullPresetDoc = null;
  viewingVersion = null;
  preset = blankPreset();
  presetNameInput.value = "";
  selectedIds = new Set();
  nextElSeq = 1;
  undoStack = [];
  redoStack = [];
  redrawCanvas();
  renderPropsPanel();
  refreshVersionSelect();
  await refreshPresetList();
  markSnapshotClean();
  forgetLastPreset();
});

/* ---- set active (instant cut live, per the confirmed v1 scope - no
   transition/animation). Points this preset at whichever version is
   currently loaded on canvas, then (if this preset isn't already the live
   one) makes the preset itself live too. Both steps use the same
   full-state-push pattern as everything else. ---- */
const activeStatusEl = document.getElementById("activeStatus");

function updateActiveStatus(){
  activeStatusEl.style.color = "";
  if(!socket.connected){
    activeStatusEl.textContent = "⚠ Not connected to server";
    activeStatusEl.style.color = "#ff6b6b";
    return;
  }
  if(!liveGameState){
    activeStatusEl.textContent = "Connected, waiting for server state…";
    return;
  }
  const isThisPresetLive = presetMeta && liveGameState.activePresetId === presetMeta.id;
  const isThisVersionLive = isThisPresetLive && fullPresetDoc && viewingVersion === fullPresetDoc.activeVersion;
  if(isThisVersionLive){
    activeStatusEl.textContent = "● Live now";
    activeStatusEl.style.color = "#4caf50";
  } else if(isThisPresetLive){
    activeStatusEl.textContent = "A different version of this preset is live (v" + fullPresetDoc.activeVersion + ")";
  } else {
    activeStatusEl.textContent = liveGameState.activePresetId ? "Another preset is live" : "Not live (showing built-in fallback)";
  }
}

document.getElementById("btnSetActive").addEventListener("click", async () => {
  if(!presetMeta || viewingVersion === null){
    alert("Save this preset first before setting it active.");
    return;
  }
  if(!socket.connected){
    activeStatusEl.textContent = "⚠ Not connected to server - try again";
    activeStatusEl.style.color = "#ff6b6b";
    return;
  }
  activeStatusEl.textContent = "Setting active…";
  activeStatusEl.style.color = "";

  const res = await fetch("/api/presets/" + presetMeta.id + "/active-version", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ version: viewingVersion }),
  });
  if(!res.ok){
    activeStatusEl.textContent = "⚠ Failed to set active version";
    activeStatusEl.style.color = "#ff6b6b";
    return;
  }
  fullPresetDoc = await res.json();
  refreshVersionSelect();

  socket.emit("setActivePreset", { presetId: presetMeta.id });
});

/* ---- init ---- */
fitCanvas();
redrawCanvas();
refreshVersionSelect();
refreshPresetList().then(async () => {
  // Always reopen whatever was last saved, rather than a blank canvas -
  // restoreLastPreset() is a no-op (returns false) the very first time the
  // editor's ever been opened in this browser, or after New/Delete/picking
  // "New preset..." explicitly forgot it (see forgetLastPreset calls).
  await restoreLastPreset();
});
</script>
</body>
</html>
